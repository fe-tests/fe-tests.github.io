<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 编程模型实验室</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand">
      <span class="brand-emoji">🧪</span>
      <div>
        <h1 class="brand-title" id="site-title">AI 编程模型实验室</h1>
        <p class="brand-subtitle" id="site-subtitle">小参数 AI 编程模型的网页效果展示</p>
      </div>
    </div>
    <div class="header-tools">
      <input class="search" id="search" type="search" placeholder="搜索页面…  (支持标题/描述/标签)" autocomplete="off">
      <div class="view-toggle" role="group" aria-label="视图切换">
        <button class="toggle-btn active" data-view="card" title="卡片视图">▦</button>
        <button class="toggle-btn" data-view="list" title="列表视图">☰</button>
      </div>
    </div>
  </div>
  <nav class="category-bar" id="category-bar"></nav>
</header>

<main class="wrap">
  <section class="toolbar">
    <div class="result-count" id="result-count"></div>
    <div class="sort-box">
      <label for="sort">排序</label>
      <select id="sort">
        <option value="pinned-desc">置顶优先</option>
        <option value="updated-desc">最近更新</option>
        <option value="created-desc">创建时间</option>
        <option value="title-asc">标题 A→Z</option>
      </select>
    </div>
  </section>

  <section id="grid" class="view-card"></section>
  <section id="grid" class="view-list hidden"></section>

  <div class="empty hidden" id="empty">
    <div class="empty-emoji">🫥</div>
    <p>没有找到匹配的结果。</p>
  </div>
</main>

<footer class="site-footer">
  <p>由 Agent 客户端维护 · <a href="README.md" target="_blank" rel="noopener">如何注册新页面 →</a></p>
</footer>

<script src="assets/registry.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
