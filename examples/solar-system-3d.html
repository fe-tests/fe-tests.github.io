<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D 太阳系 · 行星运行图</title>
<style>
  :root{
    --bg:#04060c; --panel:rgba(14,17,26,.86); --line:#2a2f3a; --fg:#e7eaf0;
    --dim:#98a2b6; --acc:#6ea8fe; --gold:#ffd166;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  #c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #c.drag{cursor:grabbing}

  #topbar{position:fixed;left:0;top:0;right:0;display:flex;align-items:center;gap:14px;
    padding:10px 14px;z-index:6;pointer-events:none;
    background:linear-gradient(180deg,rgba(4,6,12,.85),rgba(4,6,12,0))}
  .back{pointer-events:auto;color:var(--acc);text-decoration:none;font-size:13px;white-space:nowrap}
  .ttl{font-size:15px;font-weight:600;letter-spacing:.5px;text-shadow:0 1px 6px #000}
  .meta{margin-left:auto;font-size:12px;color:var(--dim);white-space:nowrap;text-shadow:0 1px 4px #000}
  .meta b{color:var(--gold);font-weight:600}

  #panelBtn{position:fixed;right:12px;top:52px;z-index:7;border:1px solid var(--line);
    background:var(--panel);color:var(--fg);border-radius:10px;padding:7px 11px;font-size:13px;
    cursor:pointer;backdrop-filter:blur(8px)}
  #panel{position:fixed;right:12px;top:92px;width:296px;max-height:calc(100vh - 116px);z-index:7;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.55);display:flex;flex-direction:column}
  #panel.hide{display:none}
  .ph{display:flex;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--dim)}
  .ph button{margin-left:auto;background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;line-height:1}
  .pb{overflow:auto;padding:4px 12px 14px;scrollbar-width:thin}
  .pb::-webkit-scrollbar{width:6px}.pb::-webkit-scrollbar-thumb{background:#333a48;border-radius:3px}
  section{margin-top:12px}
  h4{margin:0 0 8px;font-size:11px;letter-spacing:1.4px;color:var(--acc);text-transform:uppercase;font-weight:600}
  .row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px;color:var(--dim)}
  .row label{flex:0 0 auto;min-width:64px}
  .row b{flex:0 0 auto;min-width:66px;text-align:right;color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
  .row.radio{gap:14px}
  .row.radio label{min-width:0;display:flex;align-items:center;gap:5px}
  input[type=range]{flex:1;height:20px;accent-color:var(--acc);background:transparent}
  input[type=checkbox],input[type=radio]{accent-color:var(--acc);width:15px;height:15px}
  select{flex:1;background:#111722;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
  .ck{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .btns button{flex:1;min-width:64px;background:#182233;border:1px solid #2c3a52;color:var(--fg);
    border-radius:8px;padding:6px 4px;font-size:12px;cursor:pointer}
  .btns button:hover{background:#22304a}
  .btns button.on{background:#2b4a78;border-color:#4d7ec0}

  #info{position:fixed;left:12px;bottom:12px;width:330px;max-width:calc(100vw - 24px);z-index:6;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
    backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
  #info.hide{display:none}
  #info h3{margin:0 0 2px;font-size:17px;display:flex;align-items:baseline;gap:8px}
  #info h3 span{font-size:12px;color:var(--dim);font-weight:400}
  #info .sub{font-size:11px;color:var(--acc);letter-spacing:1px;margin-bottom:8px}
  #facts{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
  #facts .fk{color:var(--dim)}
  #facts .fv{text-align:right;font-variant-numeric:tabular-nums}
  #idesc{margin-top:9px;font-size:12px;color:#c3cad8;line-height:1.65;border-top:1px solid var(--line);padding-top:8px}
  #info .close{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer}

  #labels{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .lab{position:absolute;transform:translate(-50%,-140%);font-size:11px;color:#cfd8e6;
    text-shadow:0 1px 4px #000,0 0 10px #000;white-space:nowrap;padding:1px 5px;border-radius:6px;
    background:rgba(6,10,18,.35);border:1px solid rgba(255,255,255,.08)}
  .lab.sel{color:#fff;background:rgba(40,90,160,.55);border-color:rgba(120,180,255,.5)}
  .lab.moon{font-size:10px;color:#9fb0c6;opacity:.85}

  #hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:5;font-size:11px;
    color:#7f8ba0;background:rgba(6,10,18,.5);padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.06);
    white-space:nowrap;pointer-events:none}
  #toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:8;font-size:12px;
    background:rgba(20,30,50,.9);border:1px solid #33507d;color:#dbe6f7;padding:7px 14px;border-radius:10px;
    opacity:0;transition:opacity .35s;pointer-events:none}

  #loading{position:fixed;inset:0;z-index:20;background:#04060c;display:flex;align-items:center;justify-content:center;
    transition:opacity .6s}
  #loading.out{opacity:0;pointer-events:none}
  .lbox{text-align:center;width:min(420px,86vw)}
  .lname{font-size:22px;letter-spacing:2px;margin-bottom:16px;color:#fff}
  .lbar{height:5px;background:#151b26;border-radius:4px;overflow:hidden;border:1px solid #232a37}
  .lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb347,#ffd166,#6ea8fe);transition:width .25s}
  #lmsg{margin-top:10px;font-size:12px;color:var(--dim);height:16px}

  @media (max-width:720px){
    #panel{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:46vh}
    #panelBtn{top:auto;bottom:8px;right:8px}
    #info{bottom:64px;width:auto;left:8px;right:8px;max-height:38vh;overflow:auto}
    #hint{display:none}
    .ttl{font-size:13px}
    .meta{font-size:11px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<div id="topbar">
  <a class="back" href="/">← 返回首页</a>
  <div class="ttl">☀️ 3D 太阳系 · 行星运行图</div>
  <div class="meta"><b id="fps">--</b> FPS · <b id="speedHud">--</b> · <b id="simdate">--</b></div>
</div>

<button id="panelBtn">⚙ 控制台</button>

<aside id="panel">
  <div class="ph"><span>参数控制</span><button id="panelClose" title="收起">×</button></div>
  <div class="pb">
    <section>
      <h4>时间</h4>
      <div class="row"><label>流速</label><input id="speed" type="range" min="0" max="100" step="1" value="46"><b id="speedVal">--</b></div>
      <div class="btns">
        <button id="btnPause">⏸ 暂停</button>
        <button id="btnNow">今天</button>
        <button id="btnJ2000">J2000</button>
      </div>
    </section>
    <section>
      <h4>显示图层</h4>
      <div class="grid">
        <label class="ck"><input type="checkbox" id="cbOrbit" checked>轨道线</label>
        <label class="ck"><input type="checkbox" id="cbLabel" checked>名称标签</label>
        <label class="ck"><input type="checkbox" id="cbMoon" checked>卫星</label>
        <label class="ck"><input type="checkbox" id="cbBelt" checked>小行星带</label>
        <label class="ck"><input type="checkbox" id="cbKuiper" checked>柯伊伯带</label>
        <label class="ck"><input type="checkbox" id="cbComet" checked>彗星</label>
        <label class="ck"><input type="checkbox" id="cbStars" checked>星空/银河</label>
        <label class="ck"><input type="checkbox" id="cbGrid" checked>黄道网格</label>
        <label class="ck"><input type="checkbox" id="cbGlow" checked>日冕/光晕</label>
        <label class="ck"><input type="checkbox" id="cbNight" checked>地球夜灯</label>
      </div>
    </section>
    <section>
      <h4>比例模型</h4>
      <div class="row radio">
        <label><input type="radio" name="scale" id="rbCompress" checked>示意压缩</label>
        <label><input type="radio" name="scale" id="rbReal">真实距离</label>
      </div>
      <div class="row"><label>尺寸放大</label><input id="sizeExag" type="range" min="1" max="60" step="1" value="8" disabled><b id="sizeVal">关闭</b></div>
      <div class="row"><label>卫星距离</label><input id="moonDist" type="range" min="40" max="220" step="1" value="100"><b id="moonDistVal">1.00×</b></div>
    </section>
    <section>
      <h4>光照 / 相机</h4>
      <div class="row"><label>曝光</label><input id="exposure" type="range" min="30" max="220" step="1" value="112"><b id="expVal">1.12</b></div>
      <div class="row"><label>视野 FOV</label><input id="fov" type="range" min="25" max="95" step="1" value="55"><b id="fovVal">55°</b></div>
      <div class="row"><label>聚焦天体</label><select id="selFocus"></select></div>
      <div class="btns">
        <button id="btnReset">重置视角</button>
        <button id="btnTop">俯视</button>
        <button id="btnFull">全景</button>
      </div>
    </section>
  </div>
</aside>

<div id="info" class="hide">
  <button class="close" id="infoClose">×</button>
  <h3 id="iname">太阳 <span id="ien"></span></h3>
  <div class="sub" id="itype">G2V 主序星</div>
  <div id="facts"></div>
  <div id="idesc"></div>
</div>

<div id="hint">拖拽旋转 · 滚轮缩放 · 右键/双指平移 · 点击天体聚焦 · 空格暂停 · 1-9 聚焦 · Esc 总览</div>
<div id="toast"></div>

<div id="loading">
  <div class="lbox">
    <div class="lname">☀️ 3D 太阳系</div>
    <div class="lbar"><i id="lfill"></i></div>
    <div id="lmsg">正在加载 Three.js …</div>
  </div>
</div>

<script src="//cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

var SNOISE = `
vec3 mod289(vec3 x){return x - floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x - floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
             i.z + vec4(0.0, i1.z, i2.z, 1.0))
           + i.y + vec4(0.0, i1.y, i2.y, 1.0))
           + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x2_ = x_ * ns.x + ns.yyyy;
  vec4 y2_ = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x2_) - abs(y2_);
  vec4 b0 = vec4(x2_.xy, y2_.xy);
  vec4 b1 = vec4(x2_.zw, y2_.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));

    if (bodies.ceres) bodies.ceres.rScene = belt.ceres.scale.x;
  }
  if (gridHelper) { var g = distOf(32); gridHelper.scale.set(g, 1, g); }
  clampCam();
}
var CERES_R = 473;
/* ===================== 每帧更新：行星 / 带 / 彗星 ===================== */
function updateBodies(tYr, tDays, el) {
  for (var i = 0; i < PLANETS.length; i++) {
    var p = PLANETS[i], rec = bodies[p.key];
    if (!rec) continue;
    orbitPosAU(p, tYr, _v);
    placeShell(rec.pivot, _v);
    var dir = p.rotH < 0 ? -1 : 1;
    var spin = 2 * Math.PI * tDays / Math.abs(p.rotH) * dir;
    rec.mesh.rotation.y = spin;
    if (rec.clouds) rec.clouds.rotation.y = spin * 1.06;
    for (var j = 0; j < rec.extras.length; j++) rec.extras[j].material.uniforms.uTime.value = el;
    for (j = 0; j < rec.moons.length; j++) {
      var m = rec.moons[j];
      var ang = m.d.M0 * DEG + 2 * Math.PI * tDays / m.d.Pd;
      m.mesh.position.set(Math.cos(ang) * m.orbitR, 0, -Math.sin(ang) * m.orbitR);
      m.mesh.rotation.y = -ang;                       // 潮汐锁定
    }
    if (rec.ringMat) {
      rec.mesh.getWorldPosition(rec.ringMat.uniforms.uPlanetW.value);
      rec.tilt.getWorldQuaternion(_q);
      rec.ringMat.uniforms.uNormal.value.set(0, 1, 0).applyQuaternion(_q);
      /* 环对球面的投影阴影：环半径在世界空间的范围与法线（着色器编译后才可用） */
      var sh = rec.mat.userData.shader;
      if (sh && sh.uniforms.uRIn) {
        sh.uniforms.uRIn.value = rec.ringInfo.inner * rec.rScene;
        sh.uniforms.uROut.value = rec.ringInfo.outer * rec.rScene;
        sh.uniforms.uRNormal.value.copy(rec.ringMat.uniforms.uNormal.value);
      }
    }
  }
}

function updateBelt(tYr) {
  if (!belt) return;
  var bs = SCALE.real ? 40 : 1;
  for (var i = 0; i < belt.N; i++) {
    var d = belt.data[i];
    var ang = d.ph + 2 * Math.PI * tYr / Math.pow(d.a, 1.5);
    var r = d.a * (1 - d.e * Math.cos(2 * ang));
    var x = Math.cos(ang) * r, z = -Math.sin(ang) * r, y = Math.sin(ang + d.node) * d.inc * r;
    var rr = Math.sqrt(x * x + y * y + z * z), k = distOf(rr) / rr;
    _v2.set(x * k, y * k, z * k);
    _q2.setFromAxisAngle(_axisY, ang * d.sp * 2.2);
    _s3.setScalar(d.s * bs);
    _m4.compose(_v2, _q2, _s3);
    belt.mesh.setMatrixAt(i, _m4);
  }
  belt.mesh.instanceMatrix.needsUpdate = true;
  orbitPosAU(CERES, tYr, _v3);
  placeShell(belt.ceres, _v3);
  belt.ceres.rotation.y = tYr * 26;
}

function basisFor(d, u, w) {
  _v5.set(Math.abs(d.y) > 0.9 ? 1 : 0, Math.abs(d.y) > 0.9 ? 0 : 1, 0);
  u.copy(d).cross(_v5).normalize();
  w.copy(u).cross(d).normalize();
}
function updateTail(geo, base, P, d, u, w, len, spread) {
  var pos = geo.attributes.position.array;
  for (var i = 0; i < base.length; i++) {
    var t = base[i][0], ox = base[i][1], oy = base[i][2];
    var o = len * (0.10 + t);
    pos[i * 3]     = P.x + d.x * o + u.x * ox * spread + w.x * oy * spread;
    pos[i * 3 + 1] = P.y + d.y * o + u.y * ox * spread + w.y * oy * spread;
    pos[i * 3 + 2] = P.z + d.z * o + u.z * ox * spread + w.z * oy * spread;
  }
  geo.attributes.position.needsUpdate = true;
  geo.computeBoundingSphere();
}
function updateComet(tYr) {
  if (!cometObj) return;
  orbitPosAU(COMET, tYr, _v3);
  var rAU = placeShell(cometObj.grp, _v3);
  var P = cometObj.grp.position;
  _v4.copy(P).normalize();                                  // 背日方向（离子尾）
  orbitPosAU(COMET, tYr + 0.004, _v2).sub(_v3).normalize();  // 轨道速度方向
  _v6.copy(_v4).addScaledVector(_v2, 0.45).normalize();      // 尘埃尾方向
  var L = (SCALE.real ? 300 : 34) * clamp(1.7 / (0.30 + rAU), 0.05, 1.7);
  basisFor(_v4, _u, _w);
  updateTail(cometObj.pts.geometry, cometObj.base, P, _v4, _u, _w, L, L);
  basisFor(_v6, _u, _w);
  updateTail(cometObj.dust.geometry, cometObj.base, P, _v6, _u, _w, L * 0.55, L * 0.95);
  var ion = clamp(1.9 / (0.35 + rAU), 0.04, 0.95);
  cometObj.pts.material.opacity = ion;
  cometObj.dust.material.opacity = ion * 0.6;
  var cs = (SCALE.real ? 14 : 2.4) * clamp(1.1 / (0.25 + rAU * 0.55), 0.35, 2.4);
  cometObj.core.scale.setScalar(cs);
  if (bodies.comet) bodies.comet.rScene = cs;
}

/* ===================== 可见性 / 名称标签 ===================== */
function chainVisible(o) { var p = o; while (p) { if (!p.visible) return false; p = p.parent; } return true; }
var labelEls = [], labelBox = document.getElementById('labels');
function buildLabels() {
  var keys = Object.keys(bodies);
  for (var i = 0; i < keys.length; i++) {
    var b = bodies[keys[i]];
    if (!b || !b.mesh) continue;
    var el = document.createElement('div');
    el.className = 'lab' + (b.parentKey ? ' moon' : '');
    el.textContent = b.cn;
    labelBox.appendChild(el);
    labelEls.push({ el: el, key: b.key, body: b });
  }
}
function updateLabels() {
  if (!UI.label) { if (labelBox.style.display !== 'none') labelBox.style.display = 'none'; return; }
  if (labelBox.style.display === 'none') labelBox.style.display = 'block';
  var w = window.innerWidth, h = window.innerHeight;
  var pf = h / (2 * Math.tan(camera.fov * DEG * 0.5));
  for (var i = 0; i < labelEls.length; i++) {
    var L = labelEls[i], b = L.body, el = L.el;
    if (!b.mesh || !chainVisible(b.mesh)) { el.style.display = 'none'; continue; }
    b.mesh.getWorldPosition(_v5);
    var dist = Math.max(_v5.distanceTo(camera.position), 1e-4);
    var r = b.rScene || 0.1;
    var sr = r / dist * pf;
    _v5.project(camera);
    if (_v5.z > 1 || _v5.x < -1.15 || _v5.x > 1.15 || _v5.y < -1.15 || _v5.y > 1.15) { el.style.display = 'none'; continue; }
    if (b.parentKey) {
      var par = bodies[b.parentKey];
      if (!par || !par.rScene || par.rScene / dist * pf < 34) { el.style.display = 'none'; continue; }
    } else if (sr < 2.2 && b.key !== 'sun') { el.style.display = 'none'; continue; }
    el.style.display = 'block';
    el.style.left = ((_v5.x * 0.5 + 0.5) * w).toFixed(1) + 'px';
    el.style.top = ((0.5 - _v5.y * 0.5) * h - Math.min(sr, 90)).toFixed(1) + 'px';
  }
}

/* ===================== 拾取 / 信息面板 / 聚焦 ===================== */
var ray = new THREE.Raycaster(), _ndc = new THREE.Vector2();
function pickAt(cx, cy) {
  var rect = canvas.getBoundingClientRect();
  _ndc.set(((cx - rect.left) / Math.max(rect.width, 1)) * 2 - 1, -((cy - rect.top) / Math.max(rect.height, 1)) * 2 + 1);
  ray.setFromCamera(_ndc, camera);
  var list = [];
  for (var i = 0; i < pickables.length; i++) if (chainVisible(pickables[i])) list.push(pickables[i]);
  var hits = ray.intersectObjects(list, false);
  if (!hits.length) { showInfo(null); return; }
  var key = hits[0].object.userData.key;
  if (!key) return;
  showInfo(key); setFocus(key);
}
function showInfo(key) {
  var box = document.getElementById('info');
  var b = key ? bodies[key] : null;
  if (!b) { box.classList.add('hide'); return; }
  document.getElementById('iname').innerHTML = esc(b.cn) + ' <span id="ien">' + esc(b.en || '') + '</span>';
  document.getElementById('itype').textContent = b.type || '';
  var f = b.facts || {}, html = '';
  for (var k in f) if (f.hasOwnProperty(k)) html += '<div class="fk">' + esc(k) + '</div><div class="fv">' + esc(f[k]) + '</div>';
  document.getElementById('facts').innerHTML = html;
  document.getElementById('idesc').textContent = b.desc || '';
  box.classList.remove('hide');
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function setFocus(key) {
  UI.focusKey = key || null;
  var sel = document.getElementById('selFocus');
  if (sel) sel.value = key || '';
  for (var i = 0; i < labelEls.length; i++) labelEls[i].el.classList.toggle('sel', labelEls[i].key === UI.focusKey);
  if (!key) { CAM.pan.set(0, 0, 0); CAM.distGoal = SCALE.real ? 9000 : 640; clampCam(); return; }
  var b = bodies[key];
  CAM.distGoal = Math.max((b && b.rScene ? b.rScene : 1) * 7.5, 0.5);
  clampCam();
}
var toastT = 0;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.style.opacity = '1';
  clearTimeout(toastT);
  toastT = setTimeout(function () { el.style.opacity = '0'; }, 2600);
}
/* ===================== HUD / 控件联动 ===================== */
function $(id) { return document.getElementById(id); }
function fmtSpeed(dps) {
  if (dps <= 0) return '已停止';
  if (dps < 1) return (dps * 1440).toFixed(0) + ' 分/秒';
  if (dps < 365.25) return dps.toFixed(dps < 10 ? 1 : 0) + ' 天/秒';
  return (dps / 365.25).toFixed(2) + ' 年/秒';
}
function fmtDate(ms) {
  var d = new Date(ms), p = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate());
}
function togglePause() {
  UI.paused = !UI.paused;
  $('btnPause').textContent = UI.paused ? '▶ 播放' : '⏸ 暂停';
}
function buildFocusSelect() {
  var html = '<option value="">（自由视角）</option><option value="sun">太阳</option>';
  for (var i = 0; i < PLANETS.length; i++) html += '<option value="' + PLANETS[i].key + '">' + PLANETS[i].cn + '</option>';
  html += '<option value="ceres">谷神星</option><option value="comet">哈雷彗星</option>';
  for (i = 0; i < PLANETS.length; i++) {
    var list = MOONS[PLANETS[i].key];
    if (!list || !list.length) continue;
    html += '<optgroup label="' + PLANETS[i].cn + ' 卫星">';
    for (var j = 0; j < list.length; j++) html += '<option value="' + list[j].key + '">' + list[j].cn + '</option>';
    html += '</optgroup>';
  }
  $('selFocus').innerHTML = html;
}
function syncScaleUI() {
  $('sizeExag').disabled = !SCALE.real;
  $('sizeVal').textContent = SCALE.real ? ($('sizeExag').value + '×') : '关闭';
}
function bindUI() {
  var sp = $('speed');
  function syncSpeed() {
    var v = +sp.value;
    UI.daysPerSec = v <= 0 ? 0 : 0.05 * Math.pow(10, v / 25);
    $('speedVal').textContent = fmtSpeed(UI.daysPerSec);
  }
  sp.addEventListener('input', syncSpeed);
  syncSpeed();
  $('btnPause').addEventListener('click', togglePause);
  $('btnNow').addEventListener('click', function () { UI.tSim = Date.now(); toast('已回到今天：' + fmtDate(UI.tSim)); });
  $('btnJ2000').addEventListener('click', function () { UI.tSim = J2000_MS; toast('已回到 J2000 历元：2000-01-01 12:00'); });

  function ck(id, fn) { var e = $(id); e.addEventListener('change', function () { fn(e.checked); }); fn(e.checked); }
  ck('cbOrbit', function (v) {
    orbitGroup.visible = v;
    for (var i = 0; i < PLANETS.length; i++) {
      var r = bodies[PLANETS[i].key];
      if (!r) continue;
      for (var j = 0; j < r.moons.length; j++) r.moons[j].line.visible = v;
    }
  });
  ck('cbLabel', function (v) { UI.label = v; });
  ck('cbMoon', function (v) {
    for (var i = 0; i < PLANETS.length; i++) {
      var r = bodies[PLANETS[i].key];
      if (!r) continue;
      for (var j = 0; j < r.moons.length; j++) r.moons[j].pivot.visible = v;
    }
  });
  ck('cbBelt', function (v) { beltGroup.visible = v; });
  ck('cbKuiper', function (v) { kuiperGroup.visible = v; });
  ck('cbComet', function (v) { if (cometObj) { cometObj.grp.visible = v; cometObj.line.visible = v; } });
  ck('cbStars', function (v) { starGroup.visible = v; });
  ck('cbGrid', function (v) { if (gridHelper) gridHelper.visible = v; });
  ck('cbGlow', function (v) {
    UI.glow = v;
    coronaA.visible = v; coronaB.visible = v;
    for (var i = 0; i < glowSprites.length; i++) glowSprites[i].visible = v;
    for (i = 0; i < PLANETS.length; i++) {
      var r = bodies[PLANETS[i].key];
      if (!r) continue;
      for (var j = 0; j < r.extras.length; j++) r.extras[j].visible = v;
    }
  });
  ck('cbNight', function (v) { UI.night = v; var e = bodies.earth; if (e) e.mat.emissiveIntensity = v ? 2.2 : 0; });

  $('rbCompress').addEventListener('change', function () {
    SCALE.real = false; syncScaleUI(); applyScale();
    if (!UI.focusKey) CAM.distGoal = 640;
    toast('示意压缩模式：轨道距离按 a^0.62 压缩，适合看全局');
  });
  $('rbReal').addEventListener('change', function () {
    SCALE.real = true; syncScaleUI(); applyScale();
    if (!UI.focusKey) CAM.distGoal = 9000;
    toast('真实距离模式：1 AU = ' + AU_UNITS + ' 单位，行星尺寸放大 ×' + $('sizeExag').value);
  });
  $('sizeExag').addEventListener('input', function () { SCALE.sizeExag = +this.value; syncScaleUI(); applyScale(); });
  $('moonDist').addEventListener('input', function () {
    SCALE.moonDist = +this.value / 100;
    $('moonDistVal').textContent = SCALE.moonDist.toFixed(2) + '×';
    applyScale();
  });
  $('exposure').addEventListener('input', function () {
    UI.exposure = +this.value / 100;
    $('expVal').textContent = UI.exposure.toFixed(2);
    applyScale();
  });
  $('fov').addEventListener('input', function () {
    camera.fov = +this.value;
    $('fovVal').textContent = this.value + '°';
    camera.updateProjectionMatrix();
  });
  $('selFocus').addEventListener('change', function () {
    var k = this.value || null;
    showInfo(k); setFocus(k);
  });
  $('btnReset').addEventListener('click', function () {
    CAM.thetaGoal = 0.92; CAM.phiGoal = 1.06; CAM.pan.set(0, 0, 0); setFocus(null);
  });
  $('btnTop').addEventListener('click', function () { CAM.phiGoal = 0.06; CAM.pan.set(0, 0, 0); });
  $('btnFull').addEventListener('click', function () {
    CAM.phiGoal = 0.62; CAM.pan.set(0, 0, 0); setFocus(null);
    CAM.distGoal = SCALE.real ? 12600 : 980; clampCam();
  });
  $('panelBtn').addEventListener('click', function () { $('panel').classList.toggle('hide'); });
  $('panelClose').addEventListener('click', function () { $('panel').classList.add('hide'); });
  $('infoClose').addEventListener('click', function () { $('info').classList.add('hide'); });

  $('expVal').textContent = UI.exposure.toFixed(2);
  $('fovVal').textContent = $('fov').value + '°';
  $('moonDistVal').textContent = (+$('moonDist').value / 100).toFixed(2) + '×';
  syncScaleUI();
  if (IS_TOUCH) $('panel').classList.add('hide');

  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  document.addEventListener('visibilitychange', function () { last = 0; });
  window.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(tag)) return;
    var k = e.key;
    if (k === ' ') { e.preventDefault(); togglePause(); }
    else if (k === 'Escape') { setFocus(null); showInfo(null); }
    else if (k === '0') { showInfo('sun'); setFocus('sun'); }
    else if (k >= '1' && k <= '9') { var p = PLANETS[+k - 1]; if (p) { showInfo(p.key); setFocus(p.key); } }
    else if (k === '+' || k === '=') { var a = $('speed'); a.value = Math.min(100, +a.value + 5); a.dispatchEvent(new Event('input')); }
    else if (k === '-' || k === '_') { var b = $('speed'); b.value = Math.max(0, +b.value - 5); b.dispatchEvent(new Event('input')); }
    else if (k === 'h' || k === 'H') { $('panel').classList.toggle('hide'); }
  });
}
function onResize() {
  var w = window.innerWidth, h = Math.max(window.innerHeight, 1);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}

/* ===================== 主循环 ===================== */
var last = 0, fpsAcc = 0, fpsN = 0, hudT = 0;
function animate(now) {
  requestAnimationFrame(animate);
  if (!last) last = now;
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!UI.paused) UI.tSim += dt * UI.daysPerSec * 86400000;
  var tYr = tYear(), tDays = tDay(), el = now / 1000, i;

  sunMat.uniforms.uTime.value = el;
  sunMat.uniforms.uExp.value = UI.exposure;
  for (i = 0; i < sunCoronaMats.length; i++) sunCoronaMats[i].uniforms.uTime.value = el;
  var sr = bodies.sun.rScene || 1;
  for (i = 0; i < glowSprites.length; i++) {
    var sp = glowSprites[i];
    sp.scale.setScalar(sr * sp.userData.mul * (1 + 0.035 * Math.sin(el * (1.1 + i * 0.37) + i)));
  }

  updateBodies(tYr, tDays, el);
  if (belt && beltGroup.visible) updateBelt(tYr);
  if (cometObj && cometObj.grp.visible) updateComet(tYr);
  kuiperGroup.rotation.y = -2 * Math.PI * tYr / 250;
  starGroup.rotation.y = el * 0.0006;

  if (UI.focusKey && bodies[UI.focusKey] && bodies[UI.focusKey].mesh) bodies[UI.focusKey].mesh.getWorldPosition(_goal);
  else _goal.set(0, 0, 0);
  _goal.add(CAM.pan);
  CAM.dist += (CAM.distGoal - CAM.dist) * Math.min(1, dt * 6);
  CAM.theta += (CAM.thetaGoal - CAM.theta) * Math.min(1, dt * 9);
  CAM.phi += (CAM.phiGoal - CAM.phi) * Math.min(1, dt * 9);
  CAM.target.lerp(_goal, Math.min(1, dt * 7));
  camApply();

  updateLabels();
  renderer.render(scene, camera);

  fpsAcc += dt; fpsN++; hudT += dt;
  if (hudT > 0.4) {
    $('fps').textContent = fpsAcc > 0 ? (fpsN / fpsAcc).toFixed(0) : '--';
    $('speedHud').textContent = fmtSpeed(UI.daysPerSec);
    $('simdate').textContent = fmtDate(UI.tSim);
    fpsAcc = 0; fpsN = 0; hudT = 0;
  }
}

/* ===================== 启动（分步构建，带进度条） ===================== */
function setLoad(pct, msg) {
  $('lfill').style.width = pct + '%';
  $('lmsg').textContent = msg;
}
function boot() {
  onResize();
  var steps = [['太阳与日冕', function () { buildSun(); }]];
  for (var i = 0; i < PLANETS.length; i++) (function (p) {
    steps.push([p.cn + ' 表面', function () { buildPlanet(p); }]);
  })(PLANETS[i]);
  steps.push(['小行星带', function () { buildBelt(); }]);
  steps.push(['柯伊伯带', function () { buildKuiper(); }]);
  steps.push(['彗星与彗尾', function () { buildComet(); }]);
  steps.push(['星空与银河', function () { buildStars(); }]);
  steps.push(['黄道网格', function () { buildGrid(); }]);
  var idx = 0;
  function tick() {
    if (idx >= steps.length) { done(); return; }
    var s = steps[idx];
    setLoad(Math.round(idx / steps.length * 100), '正在生成 ' + s[0] + ' 贴图…');
    requestAnimationFrame(function () {
      try { s[1](); } catch (e) { console.error(e); toast('生成 ' + s[0] + ' 失败'); }
      idx++;
      tick();
    });
  }
  function done() {
    setLoad(99, '装配场景…');
    var ci = belt.ceres.userData.info;
    bodies.ceres = { key: 'ceres', cn: ci.cn, en: ci.en, type: ci.type, facts: ci.facts, desc: ci.desc, mesh: belt.ceres, group: belt.ceres };
    belt.mesh.frustumCulled = false;
    cometObj.core.userData.key = 'comet';
    pickables.push(cometObj.core);
    applyScale();
    buildFocusSelect();
    buildLabels();
    bindUI();
    UI.tSim = Date.now();
    setFocus(null);
    CAM.dist = SCALE.real ? 12000 : 980;
    CAM.distGoal = SCALE.real ? 9000 : 640;
    camApply();
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    setLoad(100, '完成');
    var l = $('loading');
    l.classList.add('out');
    setTimeout(function () { l.style.display = 'none'; }, 700);
    last = 0;
    requestAnimationFrame(animate);
    toast('轨道：J2000 根数 + 开普勒方程 · 当前 ' + fmtDate(UI.tSim));
  }
  tick();
}
boot();
</script>
