<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>2048 · Canvas 版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  :root { --board:#161922; --cell:#232735; --fg:#e6e9ef; --muted:#8b93a7; --accent:#f7b267; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 120% at 50% 0%, #1c2030 0%, #10131a 60%);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden; touch-action: none; overscroll-behavior: none;
    padding: 16px;
  }
  #app { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 14px; }

  /* top bar */
  #topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand h1 { font-size: 34px; font-weight: 900; letter-spacing: 1px; }
  .brand .sub { font-size: 12px; color: var(--muted); font-weight: 600; }
  .back { align-self: flex-start; color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .back:hover { color: var(--fg); }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--board); border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px; padding: 5px 14px; min-width: 70px; text-align: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
  }
  .score-box .lbl { display: block; font-size: 10px; color: var(--muted); letter-spacing: 2px; font-weight: 700; }
  .score-box span.val { display: block; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #newgame {
    background: linear-gradient(160deg, #f7b267, #f28d3c); color: #1a1206; border: none;
    font-size: 14px; font-weight: 800; padding: 11px 16px; border-radius: 12px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(247,178,103,.28); transition: transform .06s, filter .12s;
  }
  #newgame:active { transform: scale(.94); }
  #newgame:hover { filter: brightness(1.05); }

  /* board */
  #boardwrap { position: relative; width: 100%; }
  #canvas {
    width: 100%; height: auto; display: block; border-radius: 18px;
    background: var(--board); box-shadow: 0 20px 50px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.05);
    touch-action: none;
  }

  /* overlay */
  #overlay {
    position: absolute; inset: 0; border-radius: 18px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: rgba(16,19,26,.82); backdrop-filter: blur(6px); opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  #overlay.show { opacity: 1; pointer-events: auto; }
  .ov-card { text-align: center; padding: 28px 26px; max-width: 320px; }
  .ov-card h2 { font-size: 38px; font-weight: 900; margin-bottom: 8px; text-shadow: 0 4px 20px rgba(0,0,0,.5); }
  .ov-card p { color: var(--muted); margin-bottom: 20px; line-height: 1.5; font-size: 14px; }
  .ov-card .big { font-size: 30px; color: var(--fg); font-weight: 800; }
  .ov-btns { display: flex; gap: 10px; justify-content: center; }
  .ov-btns button {
    border: none; border-radius: 12px; padding: 13px 20px; font-size: 15px; font-weight: 800; cursor: pointer;
    transition: transform .06s;
  }
  .ov-btns button:active { transform: scale(.94); }
  .ov-btns .primary { background: linear-gradient(160deg,#f7b267,#f28d3c); color: #1a1206; }
  .ov-btns .ghost { background: rgba(255,255,255,.1); color: var(--fg); border: 1px solid rgba(255,255,255,.12); }

  /* dpad */
  #pad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: 8px; width: 210px; margin: 0 auto; }
  #pad button {
    border: 1px solid rgba(255,255,255,.1); background: var(--board); color: var(--fg);
    font-size: 24px; border-radius: 14px; cursor: pointer; aspect-ratio: 1;
    transition: background .08s, transform .05s;
  }
  #pad button:active { background: rgba(247,178,103,.22); transform: scale(.93); }
  #pad .spacer { visibility: hidden; }

  .hint { text-align: center; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .kbd { background: rgba(255,255,255,.08); border-radius: 5px; padding: 1px 6px; font-weight: 700; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <a class="back" href="../index.html">← 首页</a>
    <div class="brand"><h1>2048</h1><span class="sub">Canvas</span></div>
    <div class="scores">
      <div class="score-box"><span class="lbl">得分</span><span class="val" id="score">0</span></div>
      <div class="score-box"><span class="lbl">最佳</span><span class="val" id="best">0</span></div>
    </div>
    <button id="newgame">新游戏</button>
  </div>

  <div id="boardwrap">
    <canvas id="canvas"></canvas>
    <div id="overlay" class="show">
      <div class="ov-card">
        <h2>2048</h2>
        <p>合并相同数字，挑战达到 <b>2048</b>！<br>方向键 / WASD 或滑动控制。</p>
        <div class="ov-btns"><button class="primary" id="play-btn">开始游戏</button></div>
      </div>
    </div>
  </div>

  <div id="pad" aria-label="方向控制">
    <span class="spacer"></span>
    <button data-dir="up">▲</button>
    <span class="spacer"></span>
    <button data-dir="left">◀</button>
    <span class="spacer"></span>
    <button data-dir="right">▶</button>
    <span class="spacer"></span>
    <button data-dir="down">▼</button>
    <span class="spacer"></span>
  </div>

  <p class="hint"><span class="kbd">↑ ↓ ← →</span> 或 <span class="kbd">W A S D</span> 移动 · 手机上滑动</p>
</div>

<script>
(function () {
  "use strict";
  const GRID = 4;
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const COLORS = {
    2: "#eee4da", 4: "#e0d8c0", 8: "#f2b179", 16: "#f59563",
    32: "#f67c5f", 64: "#f65e3b", 128: "#edcf72", 256: "#edcc61",
    512: "#edc850", 1024: "#edc53f", 2048: "#edc22c"
  };
  const TILE = ["#2","#4","#8","#16","#32","#64","#128","#256","#512","#1024","#2048"];

  // board: 2D array of tile objects or null (index [row][col])
  let board, tiles, score, best, won, over, rafId;
  let CELL = 60, PAD = 12, boardPx = 300;

  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const wrap = document.getElementById("boardwrap");

  best = parseInt(localStorage.getItem("best2048") || "0", 10);
  bestEl.textContent = best;

  function newTile(value, x, y) {
    return { id: Math.random().toString(36).slice(2), value: value,
      x: x, y: y, ax: x, ay: y, scale: 1, mergedPulse: false, removed: false };
  }

  function newGame() {
    board = Array.from({ length: GRID }, () => Array(GRID).fill(null));
    tiles = []; score = 0; won = false; over = false;
    spawnTile(); spawnTile();
    updateScore();
    hideOverlay();
    if (!rafId) { rafId = requestAnimationFrame(loop); }
  }

  function emptyCells() {
    const out = [];
    for (let r = 0; r < GRID; r++) for (let c = 0; c < GRID; c++) if (!board[r][c]) out.push([r, c]);
    return out;
  }

  function spawnTile() {
    const cells = emptyCells();
    if (!cells.length) return;
    const [r, c] = cells[Math.floor(Math.random() * cells.length)];
    const t = newTile(Math.random() < 0.9 ? 2 : 4, c, r);
    board[r][c] = t; tiles.push(t);
  }

  const DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
  };

  function move(dir) {
    if (over) return;
    const vec = DIRS[dir];
    const rorder = dir === "down" ? [3, 2, 1, 0] : [0, 1, 2, 3];
    const corder = dir === "right" ? [3, 2, 1, 0] : [0, 1, 2, 3];
    let moved = false;

    for (let i = 0; i < tiles.length; i++) tiles[i].merged = false;

    for (const r of rorder) {
      for (const c of corder) {
        const t = board[r][c];
        if (!t) continue;
        let pr = r, pc = c;
        let nr = r + vec.y, nc = c + vec.x;
        while (nr >= 0 && nr < GRID && nc >= 0 && nc < GRID && !board[nr][nc]) {
          pr = nr; pc = nc; nr += vec.y; nc += vec.x;
        }
        const target = (nr >= 0 && nr < GRID && nc >= 0 && nc < GRID) ? board[nr][nc] : null;
        if (target && target.value === t.value && !target.merged) {
          board[r][c] = null;
          target.merged = true; target.mergedPulse = true; target.value *= 2;
          target.x = nc; target.y = nr;
          t.x = nc; t.y = nr; t.removed = true;
          board[nr][nc] = target;
          score += target.value;
          if (target.value === 2048 && !won) won = true;
          moved = true;
        } else {
          if (pr !== r || pc !== c) moved = true;
          board[r][c] = null;
          t.x = pc; t.y = pr;
          board[pr][pc] = t;
        }
      }
    }

    if (moved) {
      spawnTile();
      updateScore();
      cleanupRemoved();
      if (won) { showOverlay("win"); return; }
      if (!hasPossibleMove()) { over = true; showOverlay("lose"); }
    }
  }

  function cleanupRemoved() {
    for (let i = tiles.length - 1; i >= 0; i--) {
      const t = tiles[i];
      if (t.removed && Math.abs(t.ax - t.x) < 0.02 && Math.abs(t.ay - t.y) < 0.02) {
        tiles.splice(i, 1);
      }
    }
  }

  function hasPossibleMove() {
    if (emptyCells().length) return true;
    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        const v = board[r][c].value;
        if (c + 1 < GRID && board[r][c + 1].value === v) return true;
        if (r + 1 < GRID && board[r + 1][c].value === v) return true;
      }
    }
    return false;
  }

  function updateScore() {
    scoreEl.textContent = score;
    if (score > best) { best = score; localStorage.setItem("best2048", String(best)); bestEl.textContent = best; }
  }

  // ---------- layout / render ----------
  function layout() {
    const dpr = window.devicePixelRatio || 1;
    const size = wrap.clientWidth;
    const w = Math.max(240, Math.floor(size));
    PAD = Math.max(8, Math.round(w * 0.035));
    CELL = (w - PAD * (GRID + 1)) / GRID;
    boardPx = Math.round(2 * PAD + GRID * CELL + (GRID - 1) * PAD);
    const css = boardPx;
    canvas.style.width = css + "px";
    canvas.style.height = css + "px";
    canvas.width = Math.round(css * dpr);
    canvas.height = Math.round(css * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function tileRadius() { return Math.min(CELL * 0.18, 10); }

  function drawTile(t) {
    const tx = PAD + t.x * (CELL + PAD);
    const ty = PAD + t.y * (CELL + PAD);
    const cx = tx + CELL / 2, cy = ty + CELL / 2;
    const s = t.scale || 1;
    const idx = Math.min(10, Math.log2(t.value) - 1);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    roundRect(-CELL / 2, -CELL / 2, CELL, CELL, tileRadius());
    ctx.fillStyle = COLORS[t.value] || "#3c3a32";
    ctx.fill();
    ctx.restore();
    // text (unscaled for crispness)
    ctx.fillStyle = t.value <= 4 ? "#776e65" : "#f4f0e8";
    const fontSize = Math.max(14, Math.floor(CELL * 0.46));
    ctx.font = "800 " + fontSize + "px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(String(t.value), cx, cy + fontSize * 0.04);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // board bg + empty cells
    roundRect(0, 0, boardPx, boardPx, tileRadius() * 2.4);
    ctx.fillStyle = "#161922"; ctx.fill();
    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        if (board[r][c]) continue;
        const x = PAD + c * (CELL + PAD), y = PAD + r * (CELL + PAD);
        roundRect(x, y, CELL, CELL, tileRadius());
        ctx.fillStyle = "#232735"; ctx.fill();
      }
    }
    for (let i = 0; i < tiles.length; i++) drawTile(tiles[i]);
  }

  function loop() {
    const now = performance.now();
    for (const t of tiles) {
      t.ax += (t.x - t.ax) * 0.32;
      t.ay += (t.y - t.ay) * 0.32;
      if (t.mergedPulse) {
        if (!t.popT) t.popT = now;
        const p = Math.min((now - t.popT) / 150, 1);
        t.scale = 1 + 0.3 * (1 - p);
        if (p >= 1) t.mergedPulse = false;
      } else {
        t.scale += (1 - t.scale) * 0.28;
      }
    }
    // remove merged-away tiles once settled
    for (let i = tiles.length - 1; i >= 0; i--) {
      const t = tiles[i];
      if (t.removed && Math.abs(t.ax - t.x) < 0.02 && Math.abs(t.ay - t.y) < 0.02) tiles.splice(i, 1);
    }
    draw();
    rafId = requestAnimationFrame(loop);
  }

  // ---------- overlay ----------
  function showOverlay(kind) {
    const card = kind === "win"
      ? "<h2>🎉 你赢了！</h2><p>你达到了 <span class='big'>2048</span>！<br>继续挑战更高分数吧。</p>"
      : "<h2>游戏结束</h2><p>最终得分 <span class='big'>" + score + "</span>。<br>再来一局？</p>";
    const btns = kind === "win"
      ? "<button class='primary' id='ov-continue'>继续</button><button class='ghost' id='ov-restart'>新游戏</button>"
      : "<button class='primary' id='ov-restart2'>再玩一次</button>";
    overlay.innerHTML = "<div class='ov-card'>" + card + "<div class='ov-btns'>" + btns + "</div></div>";
    overlay.classList.add("show");
    const rb = document.getElementById("ov-restart") || document.getElementById("ov-restart2");
    if (rb) rb.addEventListener("click", newGame);
    const cb = document.getElementById("ov-continue");
    if (cb) cb.addEventListener("click", () => { overlay.classList.remove("show"); won = true; });
  }
  function hideOverlay() { overlay.classList.remove("show"); }

  // ---------- input ----------
  const KEYMAP = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right",
    W: "up", S: "down", A: "left", D: "right"
  };
  window.addEventListener("keydown", function (e) {
    const dir = KEYMAP[e.key];
    if (dir) { e.preventDefault(); move(dir); }
  });

  document.getElementById("newgame").addEventListener("click", newGame);
  document.getElementById("play-btn").addEventListener("click", newGame);
  document.querySelectorAll("#pad button").forEach(function (b) {
    b.addEventListener("click", function (e) { e.preventDefault(); move(b.dataset.dir); });
  });

  // swipe
  let sx = 0, sy = 0, tracking = false;
  canvas.addEventListener("pointerdown", function (e) {
    sx = e.clientX; sy = e.clientY; tracking = true;
  });
  window.addEventListener("pointermove", function (e) {
    if (!tracking) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
    tracking = false;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
    else move(dy > 0 ? "down" : "up");
  }, { passive: true });
  window.addEventListener("pointerup", function () { tracking = false; });

  window.addEventListener("resize", layout);
  layout();
  newGame();
})();
</script>
</body>
</html>
