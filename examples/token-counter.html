<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token 计数器</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0f1115; color: #e7eaf0; }
  .box { max-width: 720px; margin: 40px auto; padding: 24px; background: #171a21; border: 1px solid #2a2f3a; border-radius: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #9aa3b2; font-size: 13px; margin: 0 0 20px; }
  textarea { width: 100%; height: 180px; background: #0f1115; color: #e7eaf0; border: 1px solid #2a2f3a; border-radius: 10px; padding: 12px; font-size: 14px; resize: vertical; font-family: ui-monospace, monospace; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
  .stat { background: #1c2029; border: 1px solid #2a2f3a; border-radius: 10px; padding: 14px; }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .l { font-size: 12px; color: #9aa3b2; }
  .back { display: inline-block; margin-bottom: 16px; color: #6ea8fe; text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
<a class="back" href="../index.html">← 返回首页</a>
<div class="box">
  <h1>📐 Token 计数器</h1>
  <p class="sub">本地统计文本的字符、字节与估算 token 数（近似 BPE：约每 4 字符一个 token）。</p>
  <textarea id="input" placeholder="在此输入或粘贴文本…">小参数模型也能做不少事，例如这段文本的 token 估算。</textarea>
  <div class="grid">
    <div class="stat"><div class="n" id="chars">0</div><div class="l">字符数</div></div>
    <div class="stat"><div class="n" id="bytes">0</div><div class="l">UTF-8 字节</div></div>
    <div class="stat"><div class="n" id="tokens">0</div><div class="l">估算 tokens</div></div>
  </div>
</div>
<script>
  const input = document.getElementById("input");
  const upd = () => {
    const s = input.value;
    document.getElementById("chars").textContent = s.length;
    document.getElementById("bytes").textContent = new TextEncoder().encode(s).length;
    document.getElementById("tokens").textContent = Math.ceil(s.length / 4) + (s.trim() === "" ? 0 : 1);
  };
  input.addEventListener("input", upd); upd();
</script>
</body>
</html>
