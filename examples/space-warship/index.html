<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>太空战舰</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e1c; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #eaf0ff; user-select: none; -webkit-user-select: none;
    overscroll-behavior: none; touch-action: none;
  }
  #game { display: block; position: fixed; inset: 0; touch-action: none; }

  .back {
    position: fixed; top: 12px; left: 12px; z-index: 20;
    display: inline-block; color: #cfe0ff; text-decoration: none; font-size: 13px;
    background: rgba(20,30,60,0.55); padding: 6px 12px; border-radius: 999px;
    border: 1px solid rgba(120,150,255,0.25); backdrop-filter: blur(6px);
  }
  .back:active { transform: scale(0.95); }

  /* 覆盖层：开始 / 结束 */
  .overlay {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 35%, rgba(24,40,92,0.86), rgba(7,10,24,0.95));
    backdrop-filter: blur(8px); text-align: center; padding: 24px;
  }
  .overlay.hidden { display: none; }
  .panel { max-width: 440px; width: min(90vw, 440px); }
  .panel h1 { font-size: 34px; letter-spacing: 1px; margin-bottom: 6px; text-shadow: 0 4px 26px rgba(80,120,255,0.45); }
  .panel .sub { color: #9fb2e6; font-size: 14px; margin-bottom: 18px; line-height: 1.6; }
  .panel .hint {
    background: rgba(90,120,220,0.13); border: 1px solid rgba(120,150,255,0.24);
    border-radius: 14px; padding: 12px 14px; font-size: 13px; color: #cdd9ff; line-height: 1.85;
    text-align: left; margin-bottom: 20px;
  }
  .panel .hint b { color: #ffd66b; }
  .panel .icons { font-size: 22px; letter-spacing: 10px; margin: 2px 0 14px; }
  .score-big { font-size: 56px; font-weight: 800; color: #ffe06b; margin: 2px 0 2px; text-shadow: 0 4px 30px rgba(255,210,90,0.35); }
  .best { color: #9fb2e6; font-size: 14px; margin-bottom: 22px; }
  .best span { color: #ffe06b; font-weight: 700; }
  .btn {
    display: inline-block; cursor: pointer; border: none;
    background: linear-gradient(180deg, #5b7cff, #3a56e0); color: #fff;
    font-size: 18px; font-weight: 700; padding: 13px 40px; border-radius: 999px;
    box-shadow: 0 8px 26px rgba(58,86,224,0.5); transition: transform .08s ease;
  }
  .btn:active { transform: scale(0.95); }
  .secondary { margin-top: 16px; }
  .secondary a { color: #9fb2e6; font-size: 13px; text-decoration: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<a class="back" href="/">← 返回首页</a>

<div class="overlay" id="overlay">
  <div class="panel" id="panelStart">
    <h1 id="ov-title">🚀 太空战舰</h1>
    <div class="sub">驾驶战舰穿越星海，击落敌群，挺过无尽波次。</div>
    <div class="icons">🔫 ✈️ 🛡️ ⚡</div>
    <div class="hint">
      ⌨️ <b>键盘</b>：方向键 / WASD 控制战舰<b>上下左右</b>移动，<b>空格</b>发射（也可自动开火）。<br>
      📱 <b>触屏</b>：手指拖动（或按住）控制战舰<b>上下左右</b>方位。<br>
      🔥 战舰<b>自动开火</b>，专注走位与躲弹。<br>
      💥 击落敌人<b>得分</b>，积分累积自动<b>升关卡</b>，难度随之提升。<br>
      ⚔️ 每升 <b>5 关</b> 首领降临，击破后进入更高难度。<br>
      🟦 拾取掉落物：<b>火力升级</b>、<b>回血</b>、<b>护盾</b>。
    </div>
    <button class="btn" id="btnStart">开始战斗</button>
    <div class="secondary"><a href="/">返回首页</a></div>
  </div>

  <div class="panel" id="panelOver" style="display:none">
    <h1>战斗结束</h1>
    <div class="score-big" id="ov-score">0</div>
    <div class="best" id="ov-best">最高分：—</div>
    <div class="best" id="ov-level" style="color:#7aa8ff;margin-bottom:14px"></div>
    <button class="btn" id="btnRestart">再来一局</button>
    <div class="secondary"><a href="/">返回首页</a></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- 画布与坐标 ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = Math.max(window.innerHeight, document.documentElement.clientHeight || window.innerHeight);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", resize);
  resize();

  // ---------- 常量 ----------
  const STATE = { READY: 0, PLAYING: 1, OVER: 2 };
  const MAX_HP = 100;
  const MAX_LIVES = 3;
  const LS_KEY = "space-warship-best-v1";
  const LEVEL_STEP = 150; // 每升一关所需积分

  // ---------- 游戏状态 ----------
  let state = STATE.READY;
  let score = 0, best = 0, lives = MAX_LIVES;
  let hp = MAX_HP;
  let weapon = 1, weaponTimer = 0, shieldTimer = 0;
  let currentLevel = 1, lastBossLevel = 0;
  let shake = 0, elapsed = 0;
  let bossActive = false, spawnTimer = 0;

  const stars = [], bullets = [], enemyBullets = [], enemies = [], particles = [], powerups = [], texts = [];
  let player = null;

  // ---------- 持久化最高分 ----------
  try { best = parseInt(localStorage.getItem(LS_KEY) || "0", 10) || 0; } catch (e) {}

  // ---------- 工具 ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };

  // ---------- 音效 (Web Audio API 合成，无需外部文件) ----------
  let audioCtx = null, masterGain = null, soundOn = true, soundBtn = null;

  function initAudio() {
    try {
      if (audioCtx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.35;
      masterGain.connect(audioCtx.destination);
    } catch (e) { audioCtx = null; }
  }
  function resumeAudio() {
    if (audioCtx && audioCtx.state === "suspended") { try { audioCtx.resume(); } catch (e) {} }
  }
  function makeNoiseBuffer(seconds) {
    const len = Math.floor(audioCtx.sampleRate * seconds);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }
  // 单音：freq/Hz, waveType, 时长, 音量, 起音, 衰减, 目标频率(滑音), 滤波器频率(可选)
  function playTone(freq, type, dur, vol, attack, decay, detuneTo, filterFreq) {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (detuneTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, detuneTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    if (filterFreq) {
      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = filterFreq;
      g.connect(lp); lp.connect(masterGain);
    } else { g.connect(masterGain); }
    osc.start(t); osc.stop(t + decay + 0.02);
  }
  // 噪声（爆炸用）：dur, 音量, 起始滤波, 目标滤波(扫频)
  function playNoise(dur, vol, startFilter, toFilter) {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoiseBuffer(dur);
    const bp = audioCtx.createBiquadFilter();
    bp.type = "lowpass";
    bp.frequency.setValueAtTime(startFilter, t);
    if (toFilter) bp.frequency.exponentialRampToValueAtTime(Math.max(40, toFilter), t + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(masterGain);
    src.start(t); src.stop(t + dur + 0.02);
  }
  // 琶音（升级/开始用）：频率数组, waveType, 每音时长
  function sfxChirp(freqs, type, per) {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    for (let i = 0; i < freqs.length; i++) {
      const st = t + i * per;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freqs[i], st);
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.16, st + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, st + per * 0.9);
      osc.connect(g); g.connect(masterGain);
      osc.start(st); osc.stop(st + per + 0.05);
    }
  }
  // 各音效
  function sfxShoot() { playTone(900, "square", 0.08, 0.10, 0.001, 0.08, 320); }          // 开火：轻亮短促
  function sfxExplode(small) {                                   // 爆炸
    playNoise(small ? 0.26 : 0.6, small ? 0.3 : 0.45, 1600, small ? 260 : 120);
    playTone(small ? 160 : 95, "sawtooth", small ? 0.2 : 0.5, small ? 0.12 : 0.18, 0.006, small ? 0.2 : 0.5, small ? 80 : 45, 500);
  }
  function sfxPlayerHit() { playTone(180, "sawtooth", 0.22, 0.22, 0.005, 0.22, 70, 700); }   // 玩家受击
  function sfxPowerup() { playTone(520, "square", 0.1, 0.14, 0.001, 0.1, 880); }            // 拾取
  function sfxLevelUp() { sfxChirp([523, 659, 784], "square", 0.1); }                        // 升级
  function sfxBoss() { playTone(110, "sawtooth", 0.6, 0.24, 0.05, 0.6, 150, 320); playNoise(0.5, 0.18, 900, 420); } // Boss降临
  function sfxStart() { sfxChirp([392, 523, 659, 784], "square", 0.1); }                     // 开始
  function sfxGameOver() { playTone(420, "sine", 0.75, 0.18, 0.02, 0.75, 150); }            // 结束
  function toggleSound() { soundOn = !soundOn; }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- 星空 ----------
  function initStars() {
    stars.length = 0;
    for (let i = 0; i < 130; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 0.8 + 0.2 });
    }
    soundBtn = { x: Math.max(30, W - 22), y: 26, r: 15 };
  }

  // ---------- 玩家 ----------
  function resetPlayer() {
    const size = clamp(Math.min(W, H) * 0.10, 26, 60);
    player = { x: W / 2, y: H * 0.86, size: size, cooldown: 0, invuln: 0 };
  }

  function drawPlayer(p) {
    const s = p.size;
    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.invuln > 0 && shieldTimer <= 0 && Math.floor(elapsed * 18) % 2 === 0) ctx.globalAlpha = 0.35;

    // 尾焰
    const g = ctx.createRadialGradient(0, s * 0.55, 0, 0, s * 0.55, s * 0.7);
    g.addColorStop(0, "rgba(130,190,255,0.95)");
    g.addColorStop(1, "rgba(130,190,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, s * 0.55, s * 0.62, 0, Math.PI * 2); ctx.fill();

    // 舰身
    ctx.shadowColor = "rgba(90,150,255,0.8)"; ctx.shadowBlur = 18;
    ctx.fillStyle = "#d4e4ff";
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.72);
    ctx.lineTo(s * 0.22, -s * 0.08);
    ctx.lineTo(s * 0.52, s * 0.42);
    ctx.lineTo(s * 0.20, s * 0.32);
    ctx.lineTo(s * 0.16, s * 0.52);
    ctx.lineTo(-s * 0.16, s * 0.52);
    ctx.lineTo(-s * 0.20, s * 0.32);
    ctx.lineTo(-s * 0.52, s * 0.42);
    ctx.lineTo(-s * 0.22, -s * 0.08);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // 驾驶舱
    ctx.fillStyle = "#6ea8fe";
    ctx.beginPath(); ctx.ellipse(0, -s * 0.14, s * 0.11, s * 0.20, 0, 0, Math.PI * 2); ctx.fill();

    // 护盾
    if (shieldTimer > 0) {
      const a = 0.4 + 0.35 * Math.sin(elapsed * 14);
      ctx.strokeStyle = "rgba(90,205,255," + a + ")";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, s * 0.98, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  function drawMiniShip(x, y, s, color) {
    ctx.save(); ctx.translate(x, y); ctx.fillStyle = color || "#cfe0ff";
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.7); ctx.lineTo(s * 0.5, s * 0.5); ctx.lineTo(0, s * 0.25);
    ctx.lineTo(-s * 0.5, s * 0.5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // ---------- 弹药 ----------
  function mkBx(x, y, vx, vy, color, r, dmg) {
    return { x, y, vx, vy, r: r || 4, color: color || "#8fd4ff", dmg: dmg || 1 };
  }
  function playerFire() {
    if (soundOn) sfxShoot();
    const spd = H * 1.9;
    const bx = player.x, by = player.y - player.size * 0.6;
    if (weapon === 1) {
      bullets.push(mkBx(bx, by, 0, -spd, "#bfe6ff"));
    } else if (weapon === 2) {
      bullets.push(mkBx(bx - player.size * 0.28, by, 0, -spd, "#bfe6ff"));
      bullets.push(mkBx(bx + player.size * 0.28, by, 0, -spd, "#bfe6ff"));
    } else {
      for (let a = -2; a <= 2; a++) {
        const ang = a * 0.16;
        bullets.push(mkBx(bx, by, Math.sin(ang) * spd * 0.55, -spd * Math.cos(ang), "#bfe6ff"));
      }
    }
  }

  // ---------- 敌人 ----------
  function spawnEnemy() {
    const r = rand(16, 26);
    let type = "basic";
    const roll = Math.random();
    if (currentLevel >= 3 && roll < 0.20) type = "shooter";
    else if (roll < 0.34) type = "tank";
    const hpScale = 1 + (currentLevel - 1) * 0.12;
    const hpv = Math.ceil((type === "tank" ? rand(5, 8) : type === "shooter" ? rand(2, 3) : rand(1, 2)) * hpScale);
    const spd = rand(55, 115) + currentLevel * 5;
    const cfg = {
      basic:  { color: "#ff7a5c", score: 10 },
      tank:   { color: "#b68bff", score: 20 },
      shooter:{ color: "#ffd257", score: 25 }
    }[type];
    enemies.push({
      x: rand(r, W - r), y: -r - rand(0, 40), vx: 0, vy: spd, r,
      hp: hpv, maxHp: hpv, type, color: cfg.color, score: cfg.score,
      shootCd: rand(1.0, 2.4), t: 0, freq: rand(1.2, 2.6), amp: rand(28, 90),
      phase: Math.random() * 6, drift: (Math.random() < 0.5 ? -1 : 1) * rand(18, 60)
    });
  }

  function spawnBoss() {
    bossActive = true;
    const r = clamp(Math.min(W, H) * 0.17, 55, 110);
    enemies.push({
      x: -r, y: r + 24, vx: 90, vy: 0, r,
      hp: 90 + currentLevel * 24, maxHp: 90 + currentLevel * 24, type: "boss", color: "#ff5478", score: 500,
      shootCd: rand(0.7, 1.3), t: 0, freq: 0.5, amp: 0, phase: 0, drift: 1, onScreen: false
    });
    if (soundOn) sfxBoss();
    texts.push({ x: W / 2, y: H * 0.22, txt: "⚠ BOSS", color: "#ff7a9c", life: 1.8, size: Math.max(26, Math.min(42, W * 0.09)) });
  }

  function shootEnemyBullet(e, aimSpd) {
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    enemyBullets.push(mkBx(e.x, e.y, Math.cos(a) * aimSpd, Math.sin(a) * aimSpd, "#ff7a5c", 5, 12));
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    const r = e.r;
    ctx.shadowColor = e.color; ctx.shadowBlur = 14;
    if (e.type === "boss") {
      ctx.fillStyle = "#3a1430";
      ctx.beginPath(); ctx.moveTo(0, -r * 0.8); ctx.lineTo(r * 0.9, -r * 0.2);
      ctx.lineTo(r * 0.6, r * 0.7); ctx.lineTo(-r * 0.6, r * 0.7); ctx.lineTo(-r * 0.9, -r * 0.2);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.arc(0, -r * 0.05, r * 0.32, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(0, -r * 0.05, r * 0.14, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = e.color;
      ctx.beginPath();
      if (e.type === "tank") {
        for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i - Math.PI / 2; const px = Math.cos(a) * r, py = Math.sin(a) * r; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      } else if (e.type === "shooter") {
        for (let i = 0; i < 5; i++) { const a = Math.PI * 2 / 5 * i - Math.PI / 2; const px = Math.cos(a) * r, py = Math.sin(a) * r; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      } else {
        ctx.moveTo(0, r); ctx.lineTo(r * 0.85, -r * 0.5); ctx.lineTo(-r * 0.85, -r * 0.5); ctx.closePath();
      }
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.beginPath(); ctx.arc(0, 0, r * 0.35, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // 首领血条
    if (e.type === "boss") {
      const bw = Math.min(320, W * 0.7), bh = 8, bx = (W - bw) / 2, by = 70;
      ctx.fillStyle = "rgba(255,255,255,0.14)"; roundRect(bx, by, bw, bh, 4); ctx.fill();
      ctx.fillStyle = "#ff5478"; roundRect(bx, by, bw * clamp(e.hp / e.maxHp, 0, 1), bh, 4); ctx.fill();
      ctx.fillStyle = "#ffb3c6"; ctx.font = "700 12px system-ui"; ctx.textAlign = "center";
      ctx.fillText("LEADER", W / 2, by + bh + 14);
    }
  }

  // ---------- 掉落物 / 漂浮文字 / 粒子 ----------
  function maybeDrop(x, y) {
    if (Math.random() > 0.13) return;
    const roll = Math.random();
    const type = roll < 0.45 ? "weapon" : roll < 0.8 ? "heal" : "shield";
    const col = { weapon: "#66e0ff", heal: "#4ade80", shield: "#7aa8ff" }[type];
    powerups.push({ x, y, vy: 88, r: 14, type, color: col, t: 0 });
  }
  function spawnParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = rand(40, 320);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.35, 0.8), max: 0.8, color, r: rand(2, 4) });
    }
  }
  function spawnText(x, y, txt, color, size) {
    texts.push({ x, y, txt, color, life: 0.9, size: size || 15 });
  }

  // ---------- 伤害 / 得分 ----------
  function damagePlayer(d) {
    if (shieldTimer > 0 || player.invuln > 0) return;
    hp -= d; player.invuln = 0.9; shake = 12;
    if (soundOn) sfxPlayerHit();
    spawnParticles(player.x, player.y, "#ff5566", 16);
    if (hp <= 0) { hp = 0; loseLife(); }
  }
  function loseLife() {
    lives--;
    if (soundOn) sfxExplode(false);
    spawnParticles(player.x, player.y, "#ffd66b", 26);
    shake = 16;
    if (lives <= 0) { gameOver(); return; }
    hp = MAX_HP; player.invuln = 1.6; weapon = Math.max(1, weapon - 1);
    texts.push({ x: W / 2, y: H * 0.7, txt: "失去座舰！", color: "#ff8a8a", life: 1.2, size: 22 });
  }
  function killEnemy(e) {
    e.dead = true;
    score += e.score;
    if (soundOn) sfxExplode(e.type !== "boss");
    spawnParticles(e.x, e.y, e.color, e.type === "boss" ? 44 : 16);
    shake = Math.min(shake + (e.type === "boss" ? 16 : 4), 22);
    spawnText(e.x, e.y, "+" + e.score, "#ffd66b", e.type === "boss" ? 22 : 15);
    maybeDrop(e.x, e.y);
    if (e.type === "boss") { bossActive = false; }
  }
  function checkLevel() {
    const lv = 1 + Math.floor(score / LEVEL_STEP);
    if (lv <= currentLevel) return;
    currentLevel = lv;
    if (soundOn) sfxLevelUp();
    spawnText(W / 2, H * 0.30, "等级提升 → 等级 " + lv, "#6ea8fe", Math.max(22, Math.min(34, W * 0.07)));
    if (lv % 5 === 0 && !bossActive && lastBossLevel < lv) {
      lastBossLevel = lv;
      setTimeout(function () { if (state === STATE.PLAYING && !bossActive) spawnBoss(); }, 1300);
    }
  }

  // ---------- 更新 ----------
  function update(dt) {
    elapsed += dt;
    for (const s of stars) { s.y += (40 + s.z * 130) * dt; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }
    if (shake > 0) shake *= Math.pow(0.02, dt); if (shake < 0.3) shake = 0;

    if (state !== STATE.PLAYING) return;

    // 移动（左右 + 上下）
    if (touchActive) { player.x = touchX; player.y = touchY; }
    else {
      const sp = Math.min(W, H) * 2.1 * dt;
      if (keys.arrowleft || keys.a) player.x -= sp;
      if (keys.arrowright || keys.d) player.x += sp;
      if (keys.arrowup || keys.w) player.y -= sp;
      if (keys.arrowdown || keys.s) player.y += sp;
    }
    player.x = clamp(player.x, player.size, W - player.size);
    player.y = clamp(player.y, player.size, H - player.size);
    if (player.invuln > 0) player.invuln -= dt;

    // 自动开火
    player.cooldown -= dt;
    if (player.cooldown <= 0) { playerFire(); player.cooldown = 0.15; }

    if (weaponTimer > 0) { weaponTimer -= dt; if (weaponTimer <= 0) weapon = 1; }
    if (shieldTimer > 0) shieldTimer -= dt;
    if (spawnTimer > 0) spawnTimer -= dt;

    // 生成
    if (!bossActive && spawnTimer <= 0) {
      spawnEnemy();
      spawnTimer = Math.max(0.30, 1.35 - currentLevel * 0.065) * (0.7 + Math.random() * 0.6);
    }

    // 玩家子弹
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y < -20 || b.x < -20 || b.x > W + 20) bullets.splice(i, 1);
    }
    // 敌弹
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) enemyBullets.splice(i, 1);
    }
    // 敌人
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.t += dt;
      if (e.type === "boss") {
        if (e.x < W * 0.5 - e.r) e.x += 120 * dt; else e.onScreen = true;
        e.x += e.vx * e.drift * dt;
        if (e.x < e.r || e.x > W - e.r) e.drift *= -1;
        e.x = clamp(e.x, e.r, W - e.r);
        e.y = clamp(e.y, e.r + 20, H * 0.32);
        e.vy = 0;
        e.shootCd -= dt;
        if (e.shootCd <= 0) {
          const n = 9;
          for (let k = 0; k < n; k++) {
            const a = Math.PI * 0.22 + Math.PI * 0.56 * (k / (n - 1));
            enemyBullets.push(mkBx(e.x, e.y, Math.cos(a) * 220, Math.sin(a) * 220, "#ff5478", 6, 14));
          }
          e.shootCd = rand(0.9, 1.5);
        }
      } else {
        e.x += (e.drift + Math.sin(e.t * e.freq) * e.amp) * dt;
        e.y += e.vy * dt;
        if (e.type === "shooter") {
          e.shootCd -= dt;
          if (e.shootCd <= 0 && e.y > H * 0.14) { shootEnemyBullet(e, 230 + (currentLevel - 1) * 8); e.shootCd = Math.max(0.6, 2.4 - (currentLevel - 1) * 0.1); }
        }
        if (e.x < e.r) { e.x = e.r; e.drift = Math.abs(e.drift); }
        if (e.x > W - e.r) { e.x = W - e.r; e.drift = -Math.abs(e.drift); }
      }
      if (e.y - e.r > H) enemies.splice(i, 1);
    }

    // 掉落物
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.y += p.vy * dt; p.t += dt;
      if (p.y > H + 20) powerups.splice(i, 1);
    }
    // 粒子 & 文字
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94;
    }
    for (let i = texts.length - 1; i >= 0; i--) {
      const t = texts[i];
      t.life -= dt; t.y -= 26 * dt;
      if (t.life <= 0) texts.splice(i, 1);
    }

    // 碰撞：玩家子弹 vs 敌人
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      let hit = false;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (e.dead) continue;
        const rr = e.r + b.r;
        if (dist2(b.x, b.y, e.x, e.y) < rr * rr) {
          e.hp -= b.dmg; hit = true;
          spawnParticles(b.x, b.y, "#bff0ff", 3);
          if (e.hp <= 0) { killEnemy(e); }
          break;
        }
      }
      if (hit) bullets.splice(i, 1);
    }

    // 碰撞：敌人/敌弹 vs 玩家
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (e.dead) continue;
      const rr = e.r + player.size * 0.46;
      if (dist2(e.x, e.y, player.x, player.y) < rr * rr) {
        e.dead = true; shake = 16;
        spawnParticles(e.x, e.y, e.color, 18);
        damagePlayer(e.type === "boss" ? 40 : 18);
        enemies.splice(j, 1);
      }
    }
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      const rr = b.r + player.size * 0.42;
      if (dist2(b.x, b.y, player.x, player.y) < rr * rr) {
        enemyBullets.splice(i, 1);
        damagePlayer(b.dmg);
      }
    }
    // 碰撞：玩家 vs 掉落物
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      const rr = p.r + player.size * 0.5;
      if (dist2(p.x, p.y, player.x, player.y) < rr * rr) {
        applyPowerup(p.type);
        powerups.splice(i, 1);
      }
    }
    checkLevel();
  }

  function applyPowerup(type) {
    if (type === "weapon") {
      weapon = Math.min(3, weapon + 1); weaponTimer = 9;
      spawnText(player.x, player.y - player.size, "火力升级!", "#66e0ff", 16);
    } else if (type === "heal") {
      hp = Math.min(MAX_HP, hp + 35);
      spawnText(player.x, player.y - player.size, "+35 HP", "#4ade80", 16);
    } else {
      shieldTimer = 5;
      spawnText(player.x, player.y - player.size, "护盾!", "#7aa8ff", 16);
    }
    if (soundOn) sfxPowerup();
    spawnParticles(player.x, player.y, "#fff", 12);
  }

  // ---------- 渲染 ----------
  function drawScene() {
    // 星空
    for (const s of stars) {
      ctx.fillStyle = "rgba(200,220,255," + (s.z * 0.8).toFixed(2) + ")";
      const r = s.z * 1.7;
      ctx.fillRect(s.x, s.y, r, r);
    }
    // 敌人
    for (const e of enemies) if (!e.dead) drawEnemy(e);
    // 玩家子弹
    ctx.fillStyle = "#cfeeff";
    for (const b of bullets) {
      ctx.save();
      ctx.shadowColor = "#66ccff"; ctx.shadowBlur = 10;
      ctx.fillStyle = "#bff0ff";
      ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r * 0.7, b.r * 2.2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // 敌弹
    for (const b of enemyBullets) {
      ctx.save();
      ctx.shadowColor = b.color; ctx.shadowBlur = 10;
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // 掉落物
    for (const p of powerups) {
      ctx.save();
      ctx.translate(p.x, p.y);
      const pulse = 1 + 0.12 * Math.sin(p.t * 8);
      ctx.shadowColor = p.color; ctx.shadowBlur = 14;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(0, 0, p.r * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#08101f"; ctx.font = "700 15px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const sym = p.type === "weapon" ? "▲" : p.type === "heal" ? "+" : "◆";
      ctx.fillText(sym, 0, 1);
      ctx.restore();
    }
    // 粒子
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 玩家
    if (player && (state === STATE.PLAYING || state === STATE.OVER)) drawPlayer(player);
    // 漂浮文字
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const t of texts) {
      ctx.globalAlpha = clamp(t.life, 0, 1);
      ctx.fillStyle = t.color;
      ctx.font = "800 " + t.size + "px system-ui";
      ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 8;
      ctx.fillText(t.txt, t.x, t.y);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.save();
    ctx.textBaseline = "alphabetic";
    const fs = Math.max(17, Math.round(W * 0.046));
    ctx.font = "800 " + fs + "px system-ui";
    ctx.fillStyle = "#e7eaf0"; ctx.textAlign = "left";
    ctx.fillText("得分 " + score, 16, 36);
    ctx.font = "600 13px system-ui"; ctx.fillStyle = "#9aa3b2";
    ctx.fillText("最高 " + best, 16, 58);

    const nextScore = currentLevel * LEVEL_STEP;
    ctx.textAlign = "right"; ctx.font = "800 " + Math.max(15, Math.round(W * 0.042)) + "px system-ui";
    ctx.fillStyle = "#9fb2e6"; ctx.fillText("等级 " + currentLevel, W - 16, 36);
    ctx.textAlign = "right"; ctx.font = "600 12px system-ui"; ctx.fillStyle = "#9aa3b2";
    ctx.fillText("还差 " + Math.max(0, nextScore - score) + " 分", W - 16, 54);
    for (let i = 0; i < lives; i++) drawMiniShip(W - 28 - i * 26, 68, 11, "#8fd4ff");

    if (state === STATE.PLAYING) {
      const bw = Math.min(220, W * 0.46), bh = 10, bx = 16, by = 74;
      ctx.fillStyle = "rgba(255,255,255,0.10)"; roundRect(bx, by, bw, bh, 5); ctx.fill();
      const ratio = clamp(hp / MAX_HP, 0, 1);
      ctx.fillStyle = ratio > 0.4 ? "#4ade80" : ratio > 0.2 ? "#fbbf24" : "#f87171";
      roundRect(bx, by, bw * ratio, bh, 5); ctx.fill();
      ctx.fillStyle = "#9aa3b2"; ctx.font = "600 12px system-ui"; ctx.textAlign = "left";
      ctx.fillText("HP " + Math.ceil(hp) + " / " + MAX_HP, bx, by + 26);

      ctx.textAlign = "right"; ctx.font = "700 12px system-ui";
      if (shieldTimer > 0) { ctx.fillStyle = "#7aa8ff"; ctx.fillText("护盾 " + shieldTimer.toFixed(1) + "s", W - 16, 86); }
      if (weaponTimer > 0) { ctx.fillStyle = "#66e0ff"; ctx.fillText("火力 Lv" + weapon + " " + weaponTimer.toFixed(0) + "s", W - 16, shieldTimer > 0 ? 104 : 86); }
    }

    // 声音开关按钮 (右上角)
    if (soundBtn) {
      ctx.save();
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const bx = soundBtn.x, by = soundBtn.y, br = soundBtn.r;
      ctx.fillStyle = "rgba(20,30,60,0.55)";
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(120,150,255,0.6)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#cfe0ff"; ctx.strokeStyle = "#cfe0ff"; ctx.lineWidth = 1.5;
      if (soundOn) {
        ctx.fillRect(bx - 6, by - 3, 4, 6);
        ctx.beginPath(); ctx.moveTo(bx - 2, by - 3); ctx.lineTo(bx + 2, by - 6); ctx.lineTo(bx + 2, by + 6); ctx.lineTo(bx - 2, by + 3); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.arc(bx + 5, by, 3, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke();
        ctx.beginPath(); ctx.arc(bx + 8, by, 5, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke();
      } else {
        ctx.fillRect(bx - 6, by - 3, 4, 6);
        ctx.beginPath(); ctx.moveTo(bx - 2, by - 3); ctx.lineTo(bx + 2, by - 6); ctx.lineTo(bx + 2, by + 6); ctx.lineTo(bx - 2, by + 3); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "#ff7a7a"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(bx + 1, by - 6); ctx.lineTo(bx + 9, by + 6); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    ctx.fillStyle = "#0a0e1c"; ctx.fillRect(-24, -24, W + 48, H + 48);
    drawScene();
    ctx.restore();
    drawHUD();
  }

  // ---------- 循环 ----------
  let last = performance.now();
  function loop(t) {
    const dt = Math.min((t - last) / 1000, 0.05);
    last = t;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ---------- 输入 ----------
  const keys = {};
  let touchActive = false, touchX = W / 2, touchY = H * 0.86;

  window.addEventListener("keydown", function (e) {
    const k = e.key.toLowerCase();
    if (["arrowleft", "arrowright", "arrowup", "arrowdown", " ", "w", "a", "s", "d"].includes(k)) e.preventDefault();
    keys[k] = true;
    if (k === " " && (state !== STATE.PLAYING)) startGame();
  });
  window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });

  function clientX(e) { return e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX; }
  function clientY(e) { return e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY; }
  function onDown(e) {
    const cx = clientX(e), cy = clientY(e);
    if (soundBtn && dist2(cx, cy, soundBtn.x, soundBtn.y) <= (soundBtn.r + 4) * (soundBtn.r + 4)) {
      e.preventDefault();
      toggleSound();
      return;
    }
    e.preventDefault();
    touchActive = true; touchX = cx; touchY = cy; if (state !== STATE.PLAYING) startGame();
  }
  function onMove(e) { if (touchActive) { e.preventDefault(); touchX = clientX(e); touchY = clientY(e); } }
  function onUp(e) { e.preventDefault(); touchActive = false; }
  canvas.addEventListener("touchstart", onDown, { passive: false });
  canvas.addEventListener("touchmove", onMove, { passive: false });
  canvas.addEventListener("touchend", onUp, { passive: false });
  canvas.addEventListener("mousedown", function (e) {
    if (soundBtn && dist2(e.clientX, e.clientY, soundBtn.x, soundBtn.y) <= (soundBtn.r + 4) * (soundBtn.r + 4)) return;
    touchActive = true; touchX = e.clientX; if (state !== STATE.PLAYING) startGame();
  });
  window.addEventListener("mousemove", function (e) { if (touchActive) touchX = e.clientX; });
  window.addEventListener("mouseup", function () { touchActive = false; });

  // ---------- 流程 ----------
  function startGame() {
    initAudio(); resumeAudio();
    if (soundOn) sfxStart();
    score = 0; currentLevel = 1; lastBossLevel = 0; lives = MAX_LIVES; hp = MAX_HP;
    weapon = 1; weaponTimer = 0; shieldTimer = 0;
    shake = 0; elapsed = 0; bossActive = false; spawnTimer = 0.6;
    bullets.length = 0; enemyBullets.length = 0; enemies.length = 0;
    particles.length = 0; powerups.length = 0; texts.length = 0;
    resetPlayer();
    state = STATE.PLAYING;
    document.getElementById("overlay").classList.add("hidden");
  }

  function gameOver() {
    state = STATE.OVER;
    if (soundOn) sfxGameOver();
    if (score > best) { best = score; try { localStorage.setItem(LS_KEY, String(best)); } catch (e) {} }
    document.getElementById("ov-score").textContent = score;
    document.getElementById("ov-best").innerHTML = "最高分：<span>" + best + "</span>";
    document.getElementById("ov-level").innerHTML = "最终等级 <span>" + currentLevel + "</span>";
    document.getElementById("panelStart").style.display = "none";
    document.getElementById("panelOver").style.display = "";
    document.getElementById("overlay").classList.remove("hidden");
  }

  function bind(id, fn) { const el = document.getElementById(id); if (el) el.addEventListener("click", fn); }
  bind("btnStart", startGame);
  bind("btnRestart", startGame);

  // ---------- 初始化 ----------
  initStars();
  resetPlayer();
  document.getElementById("overlay").classList.remove("hidden");
  requestAnimationFrame(function (t) { last = t; loop(t); });
  window.addEventListener("resize", function () { initStars(); });
})();
</script>
</body>
</html>
