<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>乐曲编辑器</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1d212b;
    --border: #2a2f3a;
    --text: #e7eaf0;
    --text-dim: #9aa3b2;
    --accent: #6ea8fe;
    --accent-2: #8b8bf8;
    --red: #f87171;
    --green: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1a2030 0%, var(--bg) 55%);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    padding-bottom: 40px;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }
  a.back { display: inline-block; margin: 16px 0 8px; margin-left: 4px; color: #6ea8fe; text-decoration: none; font-size: 13px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--text-dim); font-size: 13px; margin: 0 0 16px; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }

  /* Controls */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 16px; font-size: 14px; cursor: pointer;
    transition: background .15s, border-color .15s, transform .05s;
    min-height: 42px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: linear-gradient(180deg, var(--accent), var(--accent-2)); color: #0b0e13; border-color: transparent; font-weight: 600; }
  .btn.rec { position: relative; }
  .btn.rec.on { border-color: var(--red); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-dim); }
  .btn.rec.on .dot { background: var(--red); box-shadow: 0 0 10px var(--red); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .seg button { background: transparent; color: var(--text-dim); border: 0; padding: 9px 12px; font-size: 13px; cursor: pointer; }
  .seg button.active { background: var(--accent); color: #0b0e13; }

  .field { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); }
  .field select, .field input[type=range] { accent-color: var(--accent); }
  .field select { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
  .field .val { color: var(--text); min-width: 2ch; text-align: right; }

  .spacer { flex: 1; }

  /* Status bar */
  .status { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--text-dim); margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .status b { color: var(--text); font-weight: 600; }
  .rec-time { color: var(--red); font-variant-numeric: tabular-nums; }

  /* Piano */
  .piano { position: relative; margin-top: 8px; }
  .keys { position: relative; display: flex; height: 220px; }
  .key {
    position: relative; cursor: pointer;
    border: 1px solid #0e0f13;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px;
    padding-bottom: 8px;
  }
  .key.white {
    background: linear-gradient(180deg, #fbfcfe, #e6e9ef);
    color: #333; border-radius: 0 0 7px 7px;
    flex: 1 0 0; min-width: 0;
  }
  .key.white:active, .key.white.active { background: linear-gradient(180deg, #cfe0ff, #bcd2ff); }
  .key.black {
    background: linear-gradient(180deg, #2a2e37, #13151b);
    color: #cfd4de;
    width: 44px; height: 138px; margin-left: -22px; margin-right: -22px;
    z-index: 2; border-radius: 0 0 6px 6px;
    box-shadow: 0 4px 8px rgba(0,0,0,.4);
  }
  .key.black:active, .key.black.active { background: linear-gradient(180deg, #3b5bd4, #2a47b8); }
  .key .lbl { font-size: 11px; font-weight: 600; opacity: .85; }
  .key .kbd { font-size: 10px; opacity: .55; }


  @media (max-width: 600px) {
    .keys { height: 170px; }
    .key.black { height: 110px; margin-left: -16px; margin-right: -16px; width: 30px; }
    h1 { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 返回首页</a>
  <h1>🎹 乐曲编辑器</h1>
  <p class="sub">按住琴键播放音调（按住越久，音调越长）。录制会记录每个琴键按下/松开的时刻与时长，回放严格按录制节奏还原。</p>

  <div class="panel">
    <div class="controls">
      <button class="btn primary" id="recBtn" title="开始 / 停止录制">
        <span class="dot"></span><span class="lbl-text">录制</span>
      </button>
      <button class="btn" id="playBtn" disabled title="按录制内容回放">▶ 回放</button>
      <button class="btn" id="stopBtn" disabled title="停止回放/录制">⏹ 停止</button>
      <button class="btn" id="delBtn" disabled title="清空已录制内容">🗑 清空</button>

      <div class="spacer"></div>

      <div class="field">
        波形
        <span class="seg" id="waveSeg">
          <button data-wave="sine" class="active">正弦</button>
          <button data-wave="triangle">三角</button>
          <button data-wave="square">方波</button>
          <button data-wave="sawtooth">锯齿</button>
        </span>
      </div>
      <div class="field">
        音区
        <select id="octaveSel"></select>
      </div>
      <div class="field" style="min-width:110px;">
        音量
        <input type="range" id="vol" min="0" max="100" value="70" style="width:80px">
        <span class="val" id="volVal">70</span>
      </div>
    </div>

    <div class="status">
      <div>状态：<b id="stateText">就绪</b></div>
      <div>录制时长：<span class="rec-time" id="recTime">00:00</span></div>
      <div>音符数：<b id="noteCount">0</b></div>
      <div>时长：<b id="dur">00:00</b></div>
    </div>
  </div>

  <div class="panel">
    <div class="piano">
      <div class="keys" id="keys"></div>
    </div>
    <p style="color:var(--text-dim); font-size:12px; margin:12px 0 0;">
      提示：也可用键盘演奏 —— 下排 <b>A S D F G H J K L ;</b> = 白键，上排 <b>W E T Y U I O P</b> = 黑键。
    </p>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- 音频引擎 ----------
  let ctx = null;
  let masterGain = null;
  const active = new Map(); // note -> {osc, gain}
  const noteMap = new Map(); // note number -> DOM key element
  let waveform = "sine";
  let volume = 0.7;

  function initAudio() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    masterGain = ctx.createGain();
    masterGain.gain.value = volume;
    masterGain.connect(ctx.destination);
  }

  function midiFreq(n) { return 440 * Math.pow(2, (n - 69) / 12); }

  function startTone(note) {
    initAudio();
    if (ctx.state === "suspended") ctx.resume();
    if (active.has(note)) return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = waveform;
    osc.frequency.value = midiFreq(note);
    // 避免爆音的包络
    const t = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.015);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(t);
    active.set(note, { osc, gain: g });
    const el = noteMap.get(note);
    if (el) el.classList.add("active");
  }

  function stopTone(note) {
    const info = active.get(note);
    if (!info) return;
    const t = ctx.currentTime;
    // 平滑释放，避免咔哒声
    info.gain.gain.cancelScheduledValues(t);
    info.gain.gain.setValueAtTime(info.gain.gain.value, t);
    info.gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    info.osc.stop(t + 0.09);
    active.delete(note);
    const el = noteMap.get(note);
    if (el) el.classList.remove("active");
  }

  // ---------- 琴键生成 ----------
  const NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const isBlack = (n) => [1, 3, 6, 8, 10].includes(((n % 12) + 12) % 12);
  const whiteSeq = [0, 2, 4, 5, 7, 9, 11]; // 音名在 NAMES 中的索引（白键）
  const blackSeq = [1, 3, 6, 8, 10];       // 黑键

  // 键盘映射（相对当前音区根音 C 的半音偏移）
  const keyMap = {
    KeyA: 0, KeyS: 2, KeyD: 4, KeyF: 5, KeyG: 7, KeyH: 9, KeyJ: 11,
    KeyK: 12, KeyL: 14, SemiColon: 16,
    KeyW: 1, KeyE: 3, KeyT: 6, KeyY: 8, KeyU: 10,
    KeyI: 13, KeyO: 15, KeyP: 17
  };
  const keyLabel = {
    0: "A", 1: "W", 2: "S", 3: "E", 4: "D", 5: "F", 6: "T",
    7: "G", 8: "Y", 9: "H", 10: "U", 11: "J", 12: "K", 13: "I",
    14: "L", 15: "O", 16: ";", 17: "P"
  };

  const rootSel = document.getElementById("octaveSel");
  for (let o = 2; o <= 5; o++) {
    const opt = document.createElement("option");
    opt.value = o; opt.textContent = "C" + o;
    rootSel.appendChild(opt);
  }
  let baseOctave = parseInt(rootSel.value, 10); // 根音 C 的八度号
  const OCTAVES = 2; // 显示两个八度（C..B+1）

  function noteNumber(perm) { return (baseOctave + 1) * 12 + perm; } // midi

  const keysEl = document.getElementById("keys");
  const whiteEls = [];

  function buildPiano() {
    keysEl.innerHTML = "";
    noteMap.clear();
    whiteEls.length = 0;

    const firstPerm = 0;
    const lastPerm = 12 * OCTAVES - 1;

    // 先生成白键（顺序排列）
    for (let p = firstPerm; p <= lastPerm; p++) {
      if (isBlack(p)) continue;
      const el = document.createElement("div");
      el.className = "key white";
      el.dataset.note = noteNumber(p);
      el.dataset.perm = p;
      const noteName = NAMES[((p % 12) + 12) % 12];
      const oct = Math.floor(noteNumber(p) / 12) - 1;
      const lbl = document.createElement("div"); lbl.className = "lbl"; lbl.textContent = noteName + oct;
      const kbd = document.createElement("div"); kbd.className = "kbd"; kbd.textContent = keyLabel[p] || "";
      el.appendChild(lbl); el.appendChild(kbd);
      keysEl.appendChild(el);
      whiteEls.push(el);
      bindKey(el);
    }
    // 再生成黑键，用 JS 定位到相邻白键之间
    for (let p = firstPerm; p <= lastPerm; p++) {
      if (!isBlack(p)) continue;
      const el = document.createElement("div");
      el.className = "key black";
      el.dataset.note = noteNumber(p);
      const noteName = NAMES[((p % 12) + 12) % 12];
      const oct = Math.floor(noteNumber(p) / 12) - 1;
      const lbl = document.createElement("div"); lbl.className = "lbl"; lbl.textContent = noteName + oct;
      el.appendChild(lbl);
      keysEl.appendChild(el);
      // 定位：找到以它左侧最近的白键
      let leftWhite = null;
      for (const w of whiteEls) {
        const wp = parseInt(w.dataset.perm, 10);
        if (wp < p) leftWhite = w; else break;
      }
      if (leftWhite) {
        el.style.left = (leftWhite.offsetLeft + leftWhite.offsetWidth - 22) + "px";
      } else {
        el.style.left = "-22px";
      }
      bindKey(el);
    }
    layout();
  }

  function layout() {
    document.querySelectorAll(".key.black").forEach((el) => {
      const p = parseInt(el.dataset.perm, 10);
      let leftWhite = null;
      for (const w of whiteEls) {
        if (parseInt(w.dataset.perm, 10) < p) leftWhite = w; else break;
      }
      if (leftWhite) el.style.left = (leftWhite.offsetLeft + leftWhite.offsetWidth - 22) + "px";
    });
  }
  window.addEventListener("resize", layout);

  // ---------- 演奏交互（长按播放）----------
  const pressing = new Set(); // 跟踪每个 pointer id，支持多指和弦

  function bindKey(el) {
    const note = parseInt(el.dataset.note, 10);

    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      initAudio();
      el.setPointerCapture(e.pointerId);
      pressing.add(e.pointerId);
      startTone(note);
      recordEvent(note, "on");
    });
    const release = (e) => {
      if (!pressing.has(e.pointerId)) return;
      pressing.delete(e.pointerId);
      stopTone(note);
      recordEvent(note, "off");
    };
    el.addEventListener("pointerup", release);
    el.addEventListener("pointercancel", release);
    el.addEventListener("pointerleave", (e) => { if (pressing.has(e.pointerId)) release(e); });
    // 鼠标进入即发声（更直觉）
    el.addEventListener("mouseenter", (e) => {
      if (e.buttons !== 1 || !pressing.has(e.pointerId)) return;
      if (e.pointerId === 0 || pressing.has(e.pointerId)) {
        initAudio();
        pressing.add(e.pointerId);
        startTone(note);
        recordEvent(note, "on");
      }
    });
    el.addEventListener("mouseup", (e) => {
      if (e.button !== 0) return;
      release({ pointerId: 0 });
    });
  }

  // 键盘演奏
  const heldKeys = new Set();
  window.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    const code = e.code;
    if (!(code in keyMap) || heldKeys.has(code)) return;
    e.preventDefault();
    heldKeys.add(code);
    const perm = keyMap[code];
    const note = noteNumber(perm);
    startTone(note);
    recordEvent(note, "on");
  });
  window.addEventListener("keyup", (e) => {
    const code = e.code;
    if (!(code in keyMap)) return;
    heldKeys.delete(code);
    const perm = keyMap[code];
    const note = noteNumber(perm);
    stopTone(note);
    recordEvent(note, "off");
  });

  // ---------- 录制与回放 ----------
  let events = [];      // {time, note, phase}  time = 相对于录制起点的毫秒
  let isRecording = false;
  let isPlaying = false;
  let recStart = 0;
  let recTimerId = null;
  const scheduleTimeouts = []; // 回放时用于取消
  let playRAF = null;

  const recBtn = document.getElementById("recBtn");
  const playBtn = document.getElementById("playBtn");
  const stopBtn = document.getElementById("stopBtn");
  const delBtn = document.getElementById("delBtn");
  const stateText = document.getElementById("stateText");
  const recTimeEl = document.getElementById("recTime");
  const noteCountEl = document.getElementById("noteCount");
  const durEl = document.getElementById("dur");
  function nowRec() { return performance.now() - recStart; }

  // 记录事件时去重：同一音符的连续相同 phase 只记一次，避免重复触发
  let lastPhase = new Map(); // note -> "on"|"off"
  function recordEvent(note, phase) {
    if (!isRecording) return;
    if (lastPhase.get(note) === phase) return;
    lastPhase.set(note, phase);
    events.push({ time: nowRec(), note, phase });
  }

  function fmt(ms) {
    const s = Math.floor(ms / 60);
    const rem = Math.floor(ms % 60);
    return String(s).padStart(2, "0") + ":" + String(rem).padStart(2, "0");
  }

  function setButtons() {
    recBtn.classList.toggle("on", isRecording);
    recBtn.querySelector(".lbl-text").textContent = isRecording ? "停止录制" : "录制";
    playBtn.disabled = isRecording || isPlaying || events.length === 0;
    stopBtn.disabled = !(isRecording || isPlaying);
    delBtn.disabled = isRecording || isPlaying || events.length === 0;
    if (!isRecording) recTimeEl.textContent = "00:00";
  }

  function updateStats() {
    noteCountEl.textContent = String(events.filter(e => e.phase === "on").length);
    const dur = events.length ? events[events.length - 1].time : 0;
    durEl.textContent = fmt(dur);
  }

  function startRecording() {
    events = [];
    lastPhase.clear();
    isRecording = true;
    recStart = performance.now();
    recTimerId = setInterval(() => { recTimeEl.textContent = fmt(nowRec()); }, 100);
    updateStats();
    setButtons();
  }

  function stopAll() {
    if (recTimerId) { clearInterval(recTimerId); recTimerId = null; }
    isRecording = false;
    events.forEach(e => { if (e.phase === "on") stopTone(e.note); });
    active.forEach((_, note) => stopTone(note));
    scheduleTimeouts.forEach(clearTimeout);
    scheduleTimeouts.length = 0;
    if (playRAF) { cancelAnimationFrame(playRAF); playRAF = null; }
    updateStats();
    setButtons();
  }

  function playRecording() {
    if (!events.length) return;
    isPlaying = true;
    setButtons();
    const start = performance.now();
    const total = events[events.length - 1].time;

    function tick() {
      const t = performance.now() - start;
      // 播放在此时刻发生的事件
      while (lastEvIdx < events.length && events[lastEvIdx].time <= t) {
        const ev = events[lastEvIdx++];
        if (ev.phase === "on") startTone(ev.note);
        else stopTone(ev.note);
      }
      if (t <= total) playRAF = requestAnimationFrame(tick);
      else finishPlay();
    }
    let lastEvIdx = 0;
    playRAF = requestAnimationFrame(tick);
  }

  function finishPlay() {
    isPlaying = false;
    playRAF = null;
    updateStats();
    setButtons();
  }

  // ---------- 事件绑定 ----------
  recBtn.addEventListener("click", () => {
    if (isRecording) { isRecording = false; if (recTimerId) { clearInterval(recTimerId); recTimerId = null; } }
    else startRecording();
    updateStats(); setButtons();
  });
  playBtn.addEventListener("click", () => { if (!isPlaying && events.length) playRecording(); });
  stopBtn.addEventListener("click", () => stopAll());
  delBtn.addEventListener("click", () => { if (isRecording || isPlaying) return; events = []; updateStats(); });

  document.getElementById("vol").addEventListener("input", (e) => {
    volume = e.target.value / 100;
    document.getElementById("volVal").textContent = e.target.value;
    if (masterGain) masterGain.gain.value = volume;
  });
  rootSel.addEventListener("change", () => {
    baseOctave = parseInt(rootSel.value, 10);
    buildPiano();
  });
  document.getElementById("waveSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-wave]");
    if (!b) return;
    waveform = b.dataset.wave;
    document.querySelectorAll("#waveSeg button").forEach(x => x.classList.toggle("active", x === b));
  });

  // 初始构建
  buildPiano();
  setButtons();
  updateStats();
})();
</script>
</body>
</html>
