<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑车 · 黄昏骑游 (v2)</title>
<style>
  :root {
    --sky-top:#1a2a52; --sky-bot:#e8894a; --sun:#ffcf5c;
    --grass:#1f4d2e; --grass2:#153a22;
    --road:#2c2e3a;
    --pel-body:#eaf2f9; --pel-wing:#f6fbff; --pel-limb:#a3b6cc; --pel-beak:#ff8a3c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; min-height:100%; overflow:hidden; }
  body { background:var(--sky-top); font-family:system-ui,"PingFang SC","Segoe UI",sans-serif;
         display:flex; justify-content:center; align-items:center; }
  .stage { position:relative; width:94vw; max-width:960px; border-radius:18px;
           overflow:hidden; box-shadow:0 18px 60px rgba(0,0,0,.55); }
  svg { display:block; width:100%; height:auto; }
  #hint { position:absolute; left:12px; top:10px; z-index:5;
          color:#fff; font-size:13px; letter-spacing:.5px; text-shadow:0 1px 4px rgba(0,0,0,.6);
          background:rgba(0,0,0,.25); padding:6px 10px; border-radius:8px; opacity:.9; }
  .title { position:absolute; right:12px; top:10px; z-index:5; font-size:14px;
           color:#ffd9a0; text-shadow:0 1px 4px rgba(0,0,0,.6);
           background:rgba(0,0,0,.2); padding:5px 10px; border-radius:8px; }
  @media (max-width:520px){ .title{ display:none; } }
</style>
</head>
<body>
<div class="stage">
<div class="title">鹈鹕骑车 · 黄昏骑游 v2</div>
<div id="hint"></div>
<svg id="scene" viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a52"/><stop offset="0.55" stop-color="#b9534c"/>
      <stop offset="0.78" stop-color="#e8894a"/><stop offset="1" stop-color="#ffcf5c"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4f63"/><stop offset="1" stop-color="#2c2e3a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffcf5c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect width="720" height="320" fill="url(#sky)"/>
  <!-- 太阳 -->
  <circle cx="590" cy="150" r="78" fill="url(#sunGlow)"/>
  <circle cx="590" cy="150" r="34" fill="#ffe28a"/>

  <!-- 远处山丘 -->
  <g>
    <ellipse cx="150" cy="300" rx="140" ry="46" fill="#5b3a55" opacity=".8"/>
    <ellipse cx="420" cy="298" rx="190" ry="42" fill="#6e4552" opacity=".75"/>
    <ellipse cx="660" cy="302" rx="130" ry="38" fill="#7a5150" opacity=".7"/>
  </g>

  <!-- 草地 -->
  <rect x="0" y="300" width="720" height="60" fill="var(--grass)"/>
  <rect x="0" y="340" width="720" height="40" fill="var(--grass2)"/>

  <!-- 公路虚线（无缝循环，动画组） -->
  <g fill="#ffd86b">
    <g id="dashes">
      <rect x="20"  y="355" width="52" height="6" rx="3"/>
      <rect x="140" y="355" width="52" height="6" rx="3"/>
      <rect x="260" y="355" width="52" height="6" rx="3"/>
      <rect x="380" y="355" width="52" height="6" rx="3"/>
      <rect x="500" y="355" width="52" height="6" rx="3"/>
      <rect x="620" y="355" width="52" height="6" rx="3"/>
    </g>
  </g>

  <!-- 路面 -->
  <rect x="0" y="352" width="720" height="128" fill="url(#road)"/>

  <!-- 整车组 -->
  <g id="bike" transform="translate(280 0)">
    <!-- 后轮 -->
    <g id="wheelB">
      <circle cx="130" cy="428" r="52" fill="#262831"/>
      <circle cx="130" cy="428" r="44" fill="none" stroke="#3c3f50" stroke-width="3"/>
      <g stroke="#8a8fa5" stroke-width="2.5">
        <line x1="130" y1="428" x2="130" y2="384"/><line x1="130" y1="428" x2="130" y2="472"/>
        <line x1="86"  y1="428" x2="174" y2="428"/>
        <line x1="94"  y1="394" x2="166" y2="462"/><line x1="166" y1="394" x2="94" y2="462"/>
      </g>
      <circle cx="130" cy="428" r="6" fill="#d9dce8"/>
    </g>
    <!-- 前轮 -->
    <g id="wheelF">
      <circle cx="330" cy="428" r="52" fill="#262831"/>
      <circle cx="330" cy="428" r="44" fill="none" stroke="#3c3f50" stroke-width="3"/>
      <g stroke="#8a8fa5" stroke-width="2.5">
        <line x1="330" y1="428" x2="330" y2="384"/><line x1="330" y1="428" x2="330" y2="472"/>
        <line x1="286" y1="428" x2="374" y2="428"/>
        <line x1="294" y1="394" x2="366" y2="462"/><line x1="366" y1="394" x2="294" y2="462"/>
      </g>
      <circle cx="330" cy="428" r="6" fill="#d9dce8"/>
    </g>
    <!-- 车架 -->
    <g stroke="#b24534" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M 148 428 L 210 360 L 230 360"/>
      <path d="M 210 360 L 232 288"/>
      <path d="M 148 428 L 158 338 L 220 338"/>
      <path d="M 232 288 L 318 428"/>
      <path d="M 210 338 L 238 296"/>
    </g>
    <!-- 车座 -->
    <rect x="202" y="326" width="44" height="14" rx="7" fill="#3a3d4a"/>
    <!-- 把手 -->
    <path d="M 238 296 C 250 268 268 268 280 284" fill="none" stroke="#3a3d4a" stroke-width="7" stroke-linecap="round"/>
    <!-- 踏板 -->
    <circle id="pedal" cx="210" cy="360" r="4" fill="#7d8094"/>
    <!-- 小篮子（装着面包） -->
    <path d="M 102 322 L 138 322 L 132 348 L 108 348 Z" fill="#c98b4e" stroke="#8a5a2e" stroke-width="2"/>
    <ellipse cx="120" cy="318" rx="14" ry="9" fill="#f2c46a"/>
    <ellipse cx="112" cy="316" rx="8" ry="7" fill="#e9b154"/>

    <!-- 骑手（与车身同步颠簸；坐标系同 bike 组） -->
    <g id="rider">
      <!-- 脖子 -->
      <rect x="196" y="270" width="18" height="24" rx="8" fill="var(--pel-body)"/>
      <!-- 身体 -->
      <path d="M 186 300 C 176 332 184 362 204 378 C 236 396 272 378 278 348
               C 284 322 268 300 246 292 C 228 286 202 288 186 300 Z"
            fill="var(--pel-body)" stroke="#b8c8d8" stroke-width="2"/>
      <!-- 翅膀（贴身体一侧） -->
      <path d="M 236 306 C 262 288 284 298 292 322 C 284 344 262 354 242 346
               C 232 340 228 320 236 306 Z" fill="var(--pel-wing)"/>
      <!-- 头 -->
      <circle cx="205" cy="250" r="26" fill="var(--pel-body)"/>
      <!-- 长喙 -->
      <path d="M 231 246 L 298 240 C 310 238 318 248 306 254 L 236 258 Z"
            fill="var(--pel-beak)"/>
      <!-- 眼睛 -->
      <circle cx="214" cy="242" r="4.5" fill="#1d1f26"/>
      <circle cx="216" cy="240" r="1.5" fill="#fff"/>
      <!-- 腿（握把手） -->
      <path d="M 238 372 C 250 352 252 336 246 322" stroke="var(--pel-limb)" stroke-width="9"
            stroke-linecap="round" fill="none"/>
      <!-- 尾羽 -->
      <path d="M 184 340 C 152 348 128 358 114 376 C 138 368 164 360 184 352 Z"
            fill="var(--pel-body)"/>
    </g>
  </g>

</svg>

</div>

<script>
(() => {
  const rider = document.getElementById('rider');
  const wheelF = document.getElementById('wheelF');
  const wheelB = document.getElementById('wheelB');
  const dashes = document.getElementById('dashes');
  const hint = document.getElementById('hint');

  const MIN = 15, MAX = 190;
  let speed = 90, bobPhase = 0, wheelRot = 0, dashRot = 0, last = null;
  const WHEEL_CIRC = Math.PI * 2 * 52, DASH_PERIOD = 120;

  function showHint(msg, dur = 1400) {
    hint.textContent = msg;
    clearTimeout(showHint.t);
    showHint.t = setTimeout(() => (hint.textContent = ''), dur);
  }

  const keys = {};
  const SPEED_KEYS = {up:['arrowup','w'],down:['arrowdown','s'],l:['arrowleft','a'],r:['arrowright','d']};
  const isKey = (e, arr) => arr.some(k => e.key.toLowerCase() === k);

  addEventListener('keydown', e => {
    for (const dir in SPEED_KEYS) if (isKey(e, SPEED_KEYS[dir])) keys[dir] = true;
  });
  addEventListener('keyup', e => {
    for (const dir in SPEED_KEYS) if (isKey(e, SPEED_KEYS[dir])) keys[dir] = false;
  });

  function update(t) {
    requestAnimationFrame(update);
    if (!last) { last = t; return; }
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;

    // 速度控制：↑/W 加速 ↓/S 减速 ←/→ 微调
    let d = 0;
    if (keys.up)   d += 260 * dt;
    if (keys.down) d -= 260 * dt;
    if (keys.r)    d +=  80 * dt;
    if (keys.l)    d -=  80 * dt;
    speed = Math.max(MIN, Math.min(MAX, speed + d));

    // 颠簸（骑手与车身同频）
    bobPhase += (speed / 90) * 11 * dt;
    const bob = Math.sin(bobPhase) * 5 * (speed / 90);
    rider.setAttribute('transform', `translate(0 ${bob})`);

    // 车轮旋转
    wheelRot = (wheelRot + speed * dt / WHEEL_CIRC * 360) % 360;
    wheelF.setAttribute('transform', `rotate(${wheelRot} 330 428)`);
    wheelB.setAttribute('transform', `rotate(${wheelRot} 130 428)`);

    // 虚线无缝循环
    dashRot = (dashRot + speed * dt) % DASH_PERIOD;
    dashes.setAttribute('transform', `translate(${-dashRot} 0)`);

    // 速度表盘（用文字提示）
    const kmh = (speed / 90 * 22).toFixed(0);
    if (keys.up || keys.down) showHint(`当前速度 ${kmh} km/h · ${keys.up ? '加速中' : keys.down ? '减速中' : '保持'}`, 900);
  }

  requestAnimationFrame(update);
  showHint('↑/W 加速 · ↓/S 减速 · ←/→ 微调', 3000);
})();
</script>
</body>
</html>
