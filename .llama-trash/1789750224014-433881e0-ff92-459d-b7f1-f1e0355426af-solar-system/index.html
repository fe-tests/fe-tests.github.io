<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SOLARIS · 3D 太阳系运行图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/tomlansky/three.js/blob/master/examples/js/css/OrbitControls.min.css">
<style>
:root{
  --bg:#03040b;--ink:#cfd6ff;--muted:#5f6a99;
  --cyan:#00f0ff;--magenta:#ff2e88;--lime:#a3ff12;--gold:#ffc400;
  --panel:rgba(7,11,26,.86);--line:rgba(0,240,255,.18);--fd:"Orbitron",monospace;--fm:"Share Tech Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:var(--fm);cursor:none;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%!important;height:100%!important}
/* ---- 背景层 ---- */
.bg-grid{position:fixed;inset:-100%;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px);
  background-size:54px 54px;-webkit-mask-image:radial-gradient(ellipse 85% 95% at 50% 42%,#000 30%,#0000 78%);mask-image:radial-gradient(ellipse 85% 95% at 50% 42%,#000 30%,#0000 78%);
  animation:gridpan 22s linear infinite}
@keyframes gridpan{to{transform:translate(54px,54px)}}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(700px 480px at 18% 14%,rgba(255,46,136,.10),transparent 62%),
  radial-gradient(820px 560px at 84% 76%,rgba(0,240,255,.09),transparent 62%);animation:glow 7s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.65}to{opacity:1}}
.noise{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='0.7'/></svg>");
  animation:noise .9s steps(8) infinite}
@keyframes noise{10%{background-position:9px 14px}20%{background-position:-13px 22px}30%{background-position:22px -8px}40%{background-position:-5px -20px}50%{background-position:18px 16px}60%{background-position:-17px 10px}70%{background-position:12px -14px}80%{background-position:-6px 20px}}
.crt{position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(ellipse 84% 94% at 50% 44%,transparent 58%,rgba(0,0,0,.55) 100%)}
.scanline{position:fixed;inset:0;z-index:41;pointer-events:none;opacity:.32;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}

/* ---- HUD 面板 ---- */
.hud{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.panel{
  font-size:11.5px;letter-spacing:.18em;color:var(--ink);
  border:1px solid var(--line);border-radius:8px;
  background:rgba(6,10,24,.88);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 0 30px rgba(0,240,255,.06),inset 0 1px 0 rgba(0,240,255,.2);
}
.panel .title{font-family:var(--fd);font-weight:800;letter-spacing:.35em;text-transform:uppercase;
  font-size:9.5px;color:var(--cyan);margin-bottom:8px;padding-left:10px;display:flex;justify-content:space-between;align-items:center}
.panel .row{display:flex;justify-content:space-between;padding:4px 10px;border-top:1px solid rgba(0,240,255,.1);font-family:var(--fm);font-size:11px}
.panel .row span{color:var(--muted);letter-spacing:.2em}
.panel .row b{font-weight:600;letter-spacing:.05em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);display:inline-block;box-shadow:0 0 8px var(--cyan);animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}

/* 左上 标题 */
.brand{top:18px;left:18px;padding:12px 16px}
.brand h1{font-family:var(--fd);font-weight:900;font-size:22px;letter-spacing:.32em;color:#eaf1ff;text-shadow:0 0 18px rgba(0,240,255,.35);margin-bottom:2px}
.brand .sub{color:var(--muted);font-size:10.5px;letter-spacing:.25em}
.brand .live{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--lime);font-size:10px;letter-spacing:.3em}

/* 右上 时间 */
.clock{top:18px;right:18px;padding:12px 16px;text-align:right}
.clock .day{font-family:var(--fd);font-weight:800;font-size:20px;letter-spacing:.15em;color:#eaf1ff}
.clock .date{color:var(--muted);font-size:10px;letter-spacing:.2em;margin-top:3px}

/* 左上下方 控制按钮 */
.controls{top:178px;left:18px;display:flex;flex-direction:column;gap:8px}
.btn{
  font-family:var(--fd);font-size:11px;letter-spacing:.35em;text-transform:uppercase;
  color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 14px;
  background:rgba(6,10,24,.85);cursor:pointer;pointer-events:auto;
  -webkit-tap-highlight-color:transparent;
  transition:all .15s ease;box-shadow:inset 0 0 0 1px rgba(0,240,255,.05)
}
.btn:hover{color:#fff;background:rgba(0,240,255,.12);box-shadow:0 0 18px rgba(0,240,255,.15)}
.btn.on{color:#000;background:#00f0ff;box-shadow:0 0 20px rgba(0,240,255,.4)}
.btn.d{font-size:9px;letter-spacing:.15em;color:var(--muted);background:rgba(6,10,24,.5)}

/* 右上下方 速度 */
.speedbox{top:178px;right:18px;padding:12px 14px}
.speedbox .label{color:var(--muted);font-size:10px;letter-spacing:.3em;margin-bottom:8px}
.speed-track{display:flex;gap:6px}
.speed-track button{
  font-family:var(--fd);font-size:9px;letter-spacing:.2em;
  color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:7px 10px;
  background:rgba(6,10,24,.7);cursor:pointer;pointer-events:auto;
  transition:all .12s ease;-webkit-tap-highlight-color:transparent
}
.speed-track button:hover{color:#fff;background:rgba(0,240,255,.15)}
.speed-track button.on{color:#000;background:#00f0ff;box-shadow:0 0 14px rgba(0,240,255,.35)}

/* 左侧行星列表 */
.nav{top:360px;left:18px;width:212px;padding:12px 0}
.nav .title{margin-bottom:8px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;cursor:pointer;pointer-events:auto;
  border-left:3px solid transparent;color:var(--ink);font-family:var(--fd);font-size:11.5px;
  letter-spacing:.15em;transition:all .15s ease
}
.nav-item:hover{background:rgba(0,240,255,.06);border-left-color:var(--cyan);color:#fff;padding-left:13px}
.nav-item.active{background:rgba(0,240,255,.1);border-left-color:var(--gold);color:#fff}
.nav-item .swatch{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.nav-item .d{margin-left:auto;color:var(--muted);font-size:10px}

/* 选中信息 */
.info{bottom:18px;left:50%;transform:translateX(-50%);width:min(520px,90vw);padding:14px 18px;opacity:0;transition:opacity .3s ease}
.info.show{opacity:1}
.info .title{margin-bottom:10px;justify-content:flex-start}
.info .title b{font-size:16px}

/* 底部提示 */
.tip{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:45;
  font-family:var(--fm);font-size:11px;letter-spacing:.2em;color:rgba(207,214,255,.55);
  pointer-events:none;text-align:center;
}
.tip b{color:var(--cyan);font-weight:600}
.tip .m{display:inline-block;margin:0 6px}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.75}}
.tip{animation:fadeout 8s 5s forwards}
@keyframes fadeout{to{opacity:0}}

/* 移动端按钮 */
.mnav{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;
  display:flex;gap:10px;padding:8px;border-radius:999px;pointer-events:auto;
  background:rgba(6,10,24,.85);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)
}
.mnav button{
  font-family:var(--fd);font-size:10px;letter-spacing:.1em;
  color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 14px;
  background:rgba(6,10,24,.7);cursor:pointer;-webkit-tap-highlight-color:transparent
}
.mnav button:hover{color:#fff;background:rgba(0,240,255,.12)}

/* 移动端缩放提示 */
.zoom-hint{
  position:fixed;bottom:18px;right:18px;z-index:45;
  font-family:var(--fm);font-size:10px;letter-spacing:.18em;color:rgba(207,214,255,.5);
  pointer-events:none;display:none
}

/* 移动端按钮 */
@media (max-width:680px){
  .mnav{display:flex}
  .nav{display:none}
  .controls{top:84px}
  .speedbox{top:84px}
  .brand h1{font-size:16px}
  .clock{display:none}
  .zoom-hint{display:block}
  .info{bottom:84px}
  .tip{bottom:74px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bg-grid"></div><div class="bg-glow"></div><div class="noise"></div>
<div class="crt"></div><div class="scanline"></div>

<div class="hud">
  <div class="panel brand">
    <h1>SOLARIS · 3D</h1>
    <div class="sub">PLANETARY MOTION VISUALIZER · SCALE: STYLIZED</div>
    <div class="live"><span class="dot"></span>ORBITAL SIMULATION ACTIVE</div>
  </div>
  <div class="panel clock">
    <div class="day" id="simDay">DAY 0</div>
    <div class="date" id="simDate">SIM TIME · 00:00:00</div>
  </div>
  <div class="panel controls">
    <button class="btn on" id="btnSpin">SPIN</button>
    <button class="btn" id="btnReset">RESET CAM</button>
    <button class="btn d" id="btnOrbit">ORBITS</button>
    <button class="btn d" id="btnLabels">LABELS</button>
    <button class="btn d" id="btnSpeed">TIME 1x</button>
  </div>
  <div class="panel speedbox">
    <div class="label">TIME SCALE</div>
    <div class="speed-track" id="speedTrack">
      <button class="on" data-v="1">1x</button>
      <button data-v="4">4x</button>
      <button data-v="16">16x</button>
      <button data-v="60">60x</button>
    </div>
  </div>
  <div class="panel nav" id="navPanel">
    <div class="title"><b class="dot"></b>&nbsp;SELECT TARGET</div>
    <!-- nav items injected -->
  </div>
  <div class="panel info" id="infoPanel">
    <div class="title"><b id="infoName">SUN</b></div>
    <div id="infoBody"></div>
  </div>
</div>

<div class="tip" id="tip">
  <b>DRAG</b> ROTATE&nbsp;|&nbsp;<b>SCROLL</b> / <b>PINCH</b> ZOOM&nbsp;|&nbsp;<b>TAP</b> PLANET
</div>
<div class="zoom-hint">PINCH = ZOOM</div>
<div class="mnav">
  <button id="mbtnSpin">SPIN</button>
  <button id="mbtnOrbit">ORBITS</button>
  <button id="mbtnLabel">LABELS</button>
  <button id="mbtnSpeed">TIME</button>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.js"></script>
<script>
/* ================ DATA ================ */
// 使用半对数式缩放：真实距离 × 0.5 + 最小间距 24，保证视觉上分离
const D = d => d * 0.5 + 24;
const PLANS = [
  {id:'mercury',cn:'水星',en:'MERCURY',r:0.38,orb:D(0.39),ax:5.1,tilt:.021,year:.0587,day:.243,
    c:18619100,bg:0x8b7e6b,info:'THE QUICK · 58.65 ORBITAL DAYS'},
  {id:'venus',cn:'金星',en:'VENUS',r:0.56,orb:D(0.72),ax:177.4,tilt:3.13e-4,year:.6152,day:-1.184,
    c:0xffd49f,bg:0xffc47a,info:'THE BRIGHT STAR · 250 DAYS'},
  {id:'earth',cn:'地球',en:'EARTH',r:0.62,orb:D(1.00),ax:90,tilt:23.44,year:1,day:1,
    c:0x2a6db0,bg:0x2f9f7f,info:'BLUE MARBLE · 365.25 DAYS'},
  {id:'mars',cn:'火星',en:'MARS',r:0.34,orb:D(1.52),ax:29,tilt:-5.24e-4,year:1.881,day:1.027,
    c:0xc94f2b,bg:0xc94f2b,info:'THE RED ONE · 2.34 YEARS'},
  {id:'jupiter',cn:'木星',en:'JUPITER',r:1.88,orb:D(5.20),ax:0.42,tilt:-1.31e-4,year:11.86,day:.410,
    c:0xd9a97a,bg:0xd9a97a,info:'GREAT RED SPOT · 11.86 YRS'},
  {id:'saturn',cn:'土星',en:'SATURN',r:1.53,orb:D(9.58),ax:95.2,tilt:-26.73,year:29.45,day:.444,
    c:0xf0d987,bg:0xf0d987,info:'RINGS · 29.45 YRS'},
  {id:'uranus',cn:'天王星',en:'URANUS',r:1.25,orb:D(19.20),ax:77.2,tilt:-97.77,year:84.02,day:-.655,
    c:0x9fd8ff,bg:0x9fd8ff,info:'ICE GIANT · 84.02 YRS'},
  {id:'neptune',cn:'海王星',en:'NEPTUNE',r:1.21,orb:D(30.05),ax:70.7,tilt:28.32,year:164.8,day:.669,
    c:0x4f73e0,bg:0x4f73e0,info:'WINDS 2000 KM/H · 164.8 YRS'}
];

/* ================ RENDERER ================ */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,premultipliedAlpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setClearColor(0x03040b,1);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
let W=innerWidth,H=innerHeight;
function resize(){W=innerWidth;H=innerHeight;renderer.setSize(W,H);camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const camera=new THREE.PerspectiveCamera(62,1,0.1,600);
camera.position.set(38,18,46);

/* ================ SCENE ================ */
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x03040b,0.0012);

/* ---- 星空 ---- */
{
  const stars=8000,geo=new THREE.BufferGeometry();
  const pos=new Float32Array(stars*3),col=new Float32Array(stars*3);
  for(let i=0;i<stars;i++){
    const u=Math.random(),v=Math.random(),th=0,u2=2*Math.PI*v,ph=Math.acos(1-2*u);
    const R=260+Math.random()*240;
    pos[i*3]=R*Math.sin(ph)*Math.cos(u2);
    pos[i*3+1]=R*Math.sin(ph)*Math.sin(u2);
    pos[i*3+2]=R*Math.cos(ph);
    const b=Math.random();
    if(b<0.8){col[i*3]=col[i*3+1]=col[i*3+2]=0.65+b*0.35}
    else if(b<0.92){const w=b*0.6;col[i*3]=w*240/255;col[i*3+1]=w*210/255;col[i*3+2]=w*150/255}
    else{col[i*3]=190/255;col[i*3+1]=100/255;col[i*3+2]=70/255}
  }
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const sm=new THREE.PointsMaterial({vertexColors:true,size:0.14,sizeAttenuation:true,transparent:true,opacity:.85});
  scene.add(new THREE.Points(geo,sm));
}

/* ---- 银河系光晕（远景） ---- */
const glowGeo=new THREE.PlaneGeometry(420,120);
const glowMat=new THREE.ShaderMaterial({
  transparent:true,depthTest:false,
  vertexShader:'varying vec2 uv;void main(){uv=transformedPosition.yv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}'
});
/* 用 CanvasTexture 画椭圆光晕 */
{
  const cx=canvas.width?640:1024;const g=document.createElement('canvas');
  g.width=2048;g.height=512;const c2=g.getContext('2d');
  const grad=c2.createRadialGradient(1024,256,0,1024,256,1024);
  grad.addColorStop(0,'rgba(180,200,255,0.42)');
  grad.addColorStop(0.25,'rgba(120,140,220,0.16)');
  grad.addColorStop(0.5,'rgba(80,90,180,0.05)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  c2.filter='blur(6px)';
  c2.drawImage(g,0,0);
  const t=new THREE.CanvasTexture(g);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  const m=new THREE.Mesh(glowGeo,new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:.5,side:THREE.DoubleSide,depthWrite:false}));
  m.rotation.y=Math.PI/2;
  scene.add(m);
}

/* ---- 灯光 ---- */
const sunLight=new THREE.PointLight(0xfff1d6,2.6,0,0.18);
sunLight.position.copy(sun.pos);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x334466,0.5));
const hemi=new THREE.HemisphereLight(0x8899cc,0x221111,0.35);scene.add(hemi);

/* ================ SUN ================ */
const sun={
  id:'sun',cn:'太阳',en:'SUN',pos:new THREE.Vector3(0,0,0)
};
{
  const sunGeo=new THREE.SphereGeometry(2.1,48,32);
  const sunMat=new THREE.MeshStandardMaterial({color:0xffc200,emissive:0xffa100,emissiveIntensity:1.8,roughness:.1});
  const sunMesh=new THREE.Mesh(sunGeo,sunMat);
  sunMesh.castShadow=true;
  sun.mesh=sunMesh;scene.add(sunMesh);
  /* 光晕层 */
  const halo=new THREE.Mesh(new THREE.SphereGeometry(2.4,32,24),new THREE.MeshBasicMaterial({color:0xff9900,transparent:true,opacity:.18,side:THREE.FrontSide,depthWrite:false}));
  scene.add(halo);
  /* 日 corona 粒子 */
  {
    const n=2200,p=new Float32Array(n*3),q=new Float32Array(n);
    for(let i=0;i<n;i++){
      const t=Math.random()*Math.PI*2,ph=(Math.random()-0.5)*Math.PI*1.4,R=2.3+Math.random()*1.4;
      p[i*3]=R*Math.cos(t)*Math.cos(ph);p[i*3+1]=R*Math.cos(t)*Math.sin(ph)*.6;p[i*3+2]=R*Math.sin(t);q[i]=Math.random();
    }
    sun.corona=new THREE.Points(
      Object.assign(new THREE.BufferGeometry(),{
        setAttribute('position',new THREE.Float32BufferAttribute(p,3)),
        setAttribute('aX',new THREE.Float32BufferAttribute(q,1))
      }),
      new THREE.PointsMaterial({color:0xffa500,size:.06,sizeAttenuation:true,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false})
    );
    scene.add(sun.corona);
  }
}

/* ================ PLANETS ================ */
const planets=[];
PLANS.forEach(p=>{
  const geo=new THREE.SphereGeometry(p.r,64,48);
  const mat=new THREE.MeshStandardMaterial({color:p.c,emissive:new THREE.Color(p.bg).multiplyScalar(.04),roughness:.55,metalness:.1});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.castShadow=true;mesh.receiveShadow=true;
  sun.mesh.castShadow=true;
  p.mesh=mesh;
  const orbitGroup=new THREE.Group();
  p.orbGroup=orbitGroup;
  const orbitLine=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(
    new Array(64).fill(0).map(i=>{const a=i/64*Math.PI*2;return new THREE.Vector3(p.orb*Math.sin(a),0,-p.orb*Math.cos(a))})
  ),new THREE.LineBasicMaterial({color:0x00f0ff,transparent:true,opacity:.22}));
  p.orbitLine=orbitLine;
  /* 光晕 */
  const gl=new THREE.Mesh(new THREE.SphereGeometry(p.r*1.15,24,16),
    new THREE.MeshBasicMaterial({color:new THREE.Color(p.bg).multiplyScalar(.15),transparent:true,opacity:.07,depthWrite:false,blending:THREE.AdditiveBlending}));
  orbitGroup.add(gl);
  /* 行星本身 */
  p.meshGroup=new THREE.Group();orbitGroup.add(p.meshGroup);
  orbitGroup.add(mesh);
  /* 卫星（地球的月球，木星的伽勒德，土星的泰坦） */
  if(p.id==='earth'){
    const moon=new THREE.Mesh(new THREE.SphereGeometry(0.14,24,16),
      new THREE.MeshStandardMaterial({color:0xb8b8b8,roughness:.9,metalness:.05}));
    moon.position.set(1.5,0,0);
    p.moons=[{mesh:moon,r:1.5,ang:0,angSpeed:1.3,tilt:.17}];
    orbitGroup.add(moon);
  }
  if(p.id==='jupiter'){
    p.moons=[];
    const G=(rr,col,dist,speed)=>{
      const m=new THREE.Mesh(new THREE.SphereGeometry(rr,24,16),new THREE.MeshStandardMaterial({color:col,roughness:.8}));
      m.position.set(dist,0,0);orbitGroup.add(m);
      p.moons.push({mesh:m,r:dist,ang:Math.random()*7,angSpeed:speed,tilt:.1});
      return m;
    };
    G(.2,0xc2b28e,3.1,0.6);G(.15,0x8f8f8f,2.5,1.1);G(.12,0xffc060,2.0,1.8);
  }
  if(p.id==='saturn'){
    p.moons=[];
    p.moons.push({mesh:new THREE.Mesh(new THREE.SphereGeometry(.11,24,16),new THREE.MeshStandardMaterial({color:0xffd090,roughness:.7})),r:3.4,ang:1.1,angSpeed:.7,tilt:.05});
    p.moons[0].mesh.position.set(3.4,0,0);
    orbitGroup.add(p.moons[0].mesh);
  }
  /* 轨道线 */

const touch={active:false,startX:0,startY:0,sx:0,sy:0}
const mouse={active:false,sx:0,sy:0,press:false}
const wheel={active:false,startX:0,startY:0,sx:0,sy:0}
function onDrag(e){
  const x=e.clientX||e.touches[0]?.clientX,y=e.clientY||e.touches[0]?.clientY;
  if(e.type==='touchstart'||e.type==='mousedown'){
    if(e.touches){
      touch.active=true;touch.sx=x;touch.sy=y;touch.startX=x;touch.startY=y;
      if(e.touches.length>1){
        /* 双指缩放 */
        const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
        touch.d0=d;
      }else{
        mouse.active=true;mouse.press=true;
      }
      return;
    }
    mouse.press=true;mouse.sx=e.clientX;mouse.sy=e.clientY;
    return;
  }
  if(e.type==='touchmove'||e.type==='mousemove'){
    if(e.type==='touchmove'){
      const x=e.touches[0].clientX,y=e.touches[0].clientY;
      if(touch.d0){
        const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
        const ratio=d/touch.d0;
        targetR*=ratio;
      }
      return;
    }
    return;
  }
  if(e.type==='touchend'||e.type==='mouseup'){
    if(e.touches){
      touch.active=false;touch.press=false;
      if(touch.d0){
        const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
        const ratio=d/touch.d0;
        targetR*=ratio;
      }
      return;
    }
    mouse.press=false;
    /* 判断是否为点击（移动量很小） */
    if(e.type==='mouseup'&&Math.hypot(e.clientX-mouse.sx,e.clientY-mouse.sy)<10){
      const hit=pickOnEvent(e);
      if(hit){
        if(hit===sun.mesh)focusSun();
        else{
          const p=PLANS.find(x=>x.mesh===hit);if(p)focusPlanet(p);
        }
      }
    }
    return;
  }
  if(e.type==='touchend'||e.type==='mouseup')return;
}

  const x=e.clientX,y=e.clientY;

    touch.active=true;touch.sx=x;touch.sy=y;touch.startX=x;touch.startY=y;
    const d=e.touches&&e.touches.length>1?Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY):0;

  }
});

  if(e.pointerType==='touch'){
    const x=e.touches[0].clientX,y=e.touches[0].clientY;
    if(touch.active){
      if(e.touches.length>1){
        const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
        if(touch.d0){targetR*=d/touch.d0}
      }else{
        const dx=e.movementX||x-touch.sx,dy=e.movementY||y-touch.sy;
        if(Math.hypot(dx,dy)>0.1){
          targetPhi=clamp(targetPhi-dy*0.003,0.05,Math.PI-0.05);
          targetTheta=targetTheta-dx*0.003;
          touch.sx=x;touch.sy=y;
        }
      }
    }
  }else{
    if(mouse.press){
      const dx=e.movementX,dy=e.movementY;
      if(Math.hypot(dx,dy)>0.1){
        targetPhi=clamp(targetPhi-dy*0.003,0.05,Math.PI-0.05);
        targetTheta=targetTheta-dx*0.003;
      }
    }
  }
});
canvas.addEventListener('pointerup',e=>{

      if(touch.d0){targetR*=d/touch.d0}
