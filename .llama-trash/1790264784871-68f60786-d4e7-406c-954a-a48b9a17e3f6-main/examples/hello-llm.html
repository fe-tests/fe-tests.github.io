<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello, LLM</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0f1115; color: #e7eaf0; }
  .box { max-width: 760px; margin: 40px auto; padding: 24px; background: #171a21; border: 1px solid #2a2f3a; border-radius: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #9aa3b2; font-size: 13px; margin: 0 0 20px; }
  .back { display: inline-block; margin-bottom: 16px; color: #6ea8fe; text-decoration: none; font-size: 13px; }
  .controls { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .ctrl { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #9aa3b2; }
  input[type=range] { width: 150px; }
  .out { background: #0f1115; border: 1px solid #2a2f3a; border-radius: 10px; padding: 14px; min-height: 120px; font-family: ui-monospace, monospace; white-space: pre-wrap; line-height: 1.6; }
  button { background: #6ea8fe; color: #0b0e13; border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; }
  button.secondary { background: #232836; color: #e7eaf0; border: 1px solid #2a2f3a; }
</style>
</head>
<body>
<a class="back" href="../index.html">← 返回首页</a>
<div class="box">
  <h1>🐣 Hello, LLM</h1>
  <p class="sub">一个用字符转移概率表「假装」的小参数语言模型。调整温度与种子，观察生成的多样性。</p>
  <div class="controls">
    <label class="ctrl">种子 <input id="seed" type="number" value="42"></label>
    <label class="ctrl">温度 <input id="temp" type="range" min="0.1" max="2" step="0.1" value="0.8"><span id="tempVal">0.8</span></label>
    <label class="ctrl">最大长度 <input id="len" type="number" value="60"></label>
    <button id="gen">生成</button>
    <button id="clear" class="secondary">清空</button>
  </div>
  <div class="out" id="out"></div>
</div>
<script>
// 一个简单的字符级马尔可夫模型：预置一个小的字符转移表（仅演示）。
const alphabet = " abcefgijklmnopqrstuvwxyz\n";
let rng = 42;
function rand() { rng = (rng * 1103515245 + 12345) & 0x7fffffff; return rng / 0x7fffffff; }
function softmaxRow(temp) {
  // 对每个状态生成到下一字符的概率（用随机权重 + 温度）
  const logits = alphabet.split("").map(() => (rand() - 0.5) * temp);
  const max = Math.max(...logits);
  const exp = logits.map(x => Math.exp(x - max));
  const sum = exp.reduce((a, b) => a + b, 0);
  return exp.map(x => x / sum);
}
function generate(seed, length, temp) {
  rng = seed;
  let out = " ", cur = 0;
  for (let i = 0; i < length; i++) {
    const row = softmaxRow(temp);
    let r = rand(), acc = 0, pick = 0;
    for (let k = 0; k < row.length; k++) { acc += row[k]; if (r <= acc) { pick = k; break; } }
    out += alphabet[pick];
    cur = pick;
  }
  return out.trim();
}
const outEl = document.getElementById("out");
const tempEl = document.getElementById("temp"), tempVal = document.getElementById("tempVal");
tempEl.addEventListener("input", () => tempVal.textContent = parseFloat(tempEl.value).toFixed(1));
document.getElementById("gen").addEventListener("click", () => {
  outEl.textContent = generate(+document.getElementById("seed").value, +document.getElementById("len").value, parseFloat(tempEl.value));
});
document.getElementById("clear").addEventListener("click", () => outEl.textContent = "");
document.getElementById("gen").click();
</script>
</body>
</html>
