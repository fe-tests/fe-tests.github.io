<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>SOLARIS · 3D 太阳系运行图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#03040b;--ink:#cfd6ff;--muted:#5f6a99;--cyan:#00f0ff;--lime:#a3ff12;--gold:#ffc400;--panel:rgba(7,11,26,.86);--line:rgba(0,240,255,.2);--fd:"Orbitron",monospace;--fm:"Share Tech Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:var(--fm);cursor:none;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%!important;height:100%!important}
.bg-grid{position:fixed;inset:-100%;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px);background-size:54px 54px;-webkit-mask-image:radial-gradient(ellipse 85% 95% at 50% 42%,#000 30%,#0000 78%);mask-image:radial-gradient(ellipse 85% 95% at 50% 42%,#000 30%,#0000 78%);animation:gridpan 22s linear infinite}
@keyframes gridpan{to{transform:translate(54px,54px)}}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(700px 480px at 18% 14%,rgba(255,46,136,.10),transparent 62%),radial-gradient(820px 560px at 84% 76%,rgba(0,240,255,.09),transparent 62%);animation:glow 7s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.65}to{opacity:1}}
.noise{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='0.7'/></svg>");animation:noise .9s steps(8) infinite}
@keyframes noise{10%{background-position:9px 14px}20%{background-position:-13px 22px}30%{background-position:22px -8px}40%{background-position:-5px -20px}50%{background-position:18px 16px}60%{background-position:-17px 10px}70%{background-position:12px -14px}80%{background-position:-6px 20px}}
.crt{position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(ellipse 84% 94% at 50% 44%,transparent 58%,rgba(0,0,0,.55) 100%)}
.scanline{position:fixed;inset:0;z-index:41;pointer-events:none;opacity:.30;background:repeating-linear-gradient(0deg,rgba(0,0,0,.20) 0 1px,transparent 1px 3px)}
.hud{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.panel{font-size:11.5px;letter-spacing:.18em;color:var(--ink);border:1px solid var(--line);border-radius:8px;background:rgba(6,10,24,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 0 30px rgba(0,240,255,.06),inset 0 1px 0 rgba(0,240,255,.2)}
.panel .title{font-family:var(--fd);font-weight:800;letter-spacing:.35em;text-transform:uppercase;font-size:9.5px;color:var(--cyan);padding-left:10px;display:flex;justify-content:space-between;align-items:center;min-height:20px}
.panel .row{display:flex;justify-content:space-between;padding:4px 10px;border-top:1px solid rgba(0,240,255,.1);font-family:var(--fm);font-size:11px}
.panel .row span{color:var(--muted);letter-spacing:.2em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);display:inline-block;box-shadow:0 0 8px var(--cyan);animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.brand{position:absolute;top:18px;left:18px;padding:12px 16px}
.brand h1{font-family:var(--fd);font-weight:900;font-size:22px;letter-spacing:.32em;color:#eaf1ff;text-shadow:0 0 18px rgba(0,240,255,.35);margin-bottom:2px}
.brand .sub{color:var(--muted);font-size:10.5px;letter-spacing:.25em}
.brand .live{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--lime);font-size:10px;letter-spacing:.3em}
.clock{position:absolute;top:18px;right:18px;padding:12px 16px;text-align:right}
.clock .day{font-family:var(--fd);font-weight:800;font-size:20px;letter-spacing:.15em;color:#eaf1ff}
.clock .date{color:var(--muted);font-size:10px;letter-spacing:.2em;margin-top:3px}
.controls{position:absolute;top:180px;left:18px;display:flex;flex-direction:column;gap:8px}
.btn{font-family:var(--fd);font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 14px;background:rgba(6,10,24,.85);cursor:pointer;pointer-events:auto;transition:all .15s ease;box-shadow:inset 0 0 0 1px rgba(0,240,255,.05)}
.btn:hover{color:#fff;background:rgba(0,240,255,.12);box-shadow:0 0 18px rgba(0,240,255,.15)}
.btn.on{color:#000;background:#00f0ff;box-shadow:0 0 20px rgba(0,240,255,.4)}
.btn.d{font-size:9px;letter-spacing:.15em;color:var(--muted);background:rgba(6,10,24,.5)}
.speedbox{position:absolute;top:180px;right:18px;padding:12px 14px}
.speedbox .label{color:var(--muted);font-size:10px;letter-spacing:.3em;margin-bottom:8px}
.speed-track{display:flex;gap:6px}
.speed-track button{font-family:var(--fd);font-size:9px;letter-spacing:.2em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:7px 10px;background:rgba(6,10,24,.7);cursor:pointer;pointer-events:auto;transition:all .12s ease;-webkit-tap-highlight-color:transparent}
.speed-track button:hover{color:#fff;background:rgba(0,240,255,.15)}
.speed-track button.on{color:#000;background:#00f0ff;box-shadow:0 0 14px rgba(0,240,255,.35)}
.nav{position:absolute;top:350px;left:18px;width:212px;padding:12px 0}
.nav .title{margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;cursor:pointer;pointer-events:auto;border-left:3px solid transparent;color:var(--ink);font-family:var(--fd);font-size:11.5px;letter-spacing:.15em;transition:all .15s ease}
.nav-item:hover{background:rgba(0,240,255,.06);border-left-color:var(--cyan);color:#fff;padding-left:13px}
.nav-item.active{background:rgba(0,240,255,.1);border-left-color:var(--gold);color:#fff}
.nav-item .swatch{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.nav-item .d{margin-left:auto;color:var(--muted);font-size:10px}
.info{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:min(520px,90vw);padding:14px 18px;opacity:0;transition:opacity .3s ease}
.info.show{opacity:1}
.info .title{margin-bottom:10px;justify-content:flex-start}
.info .title b{font-size:16px}
.tip{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:45;font-family:var(--fm);font-size:11px;letter-spacing:.2em;color:rgba(207,214,255,.55);pointer-events:none;text-align:center}
.tip b{color:var(--cyan);font-weight:600}
.tip{animation:fadeout 8s 5s forwards}
@keyframes fadeout{to{opacity:0}}
.mnav{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:none;flex-direction:column;gap:10px;padding:8px;border-radius:999px;pointer-events:auto;background:rgba(6,10,24,.85);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.mnav button{font-family:var(--fd);font-size:10px;letter-spacing:.1em;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:rgba(6,10,24,.7);cursor:pointer;-webkit-tap-highlight-color:transparent}
.mnav button:hover{color:#fff;background:rgba(0,240,255,.12)}
.zoom-hint{position:absolute;bottom:18px;right:18px;z-index:45;font-family:var(--fm);font-size:10px;letter-spacing:.18em;color:rgba(207,214,255,.5);pointer-events:none;display:none}
@media (max-width:680px){
  .mnav{display:flex}
  .nav{display:none}
  .controls{top:84px}
  .speedbox{top:84px}
  .brand h1{font-size:16px}
  .clock{display:none}
  .zoom-hint{display:block}
  .info{bottom:16px}
  .tip{bottom:150px}
}
</style>
</head>
<body>
<div id="stage"></div>
<div class="bg-grid"></div><div class="bg-glow"></div><div class="noise"></div>
<div class="crt"></div><div class="scanline"></div>

<div class="hud">
  <div class="panel brand">
    <h1>SOLARIS · 3D</h1>
    <div class="sub">PLANETARY MOTION VISUALIZER · SCALE: STYLIZED</div>
    <div class="live"><span class="dot"></span>ORBITAL SIMULATION ACTIVE</div>
  </div>
  <div class="panel clock">
    <div class="day" id="simDay">DAY 000</div>
    <div class="date" id="simDate">SIM TIME · 00:00:00</div>
  </div>
  <div class="panel controls">
    <button class="btn on" id="btnSpin">SPIN</button>
    <button class="btn" id="btnReset">RESET CAM</button>
    <button class="btn d" id="btnOrbit">ORBITS</button>
    <button class="btn d" id="btnLabels">LABELS</button>
    <button class="btn d" id="btnSpeed">TIME 1x</button>
  </div>
  <div class="panel speedbox">
    <div class="label">TIME SCALE</div>
    <div class="speed-track" id="speedTrack">
      <button class="on" data-v="1">1x</button>
      <button data-v="4">4x</button>
      <button data-v="16">16x</button>
      <button data-v="60">60x</button>
    </div>
  </div>
  <div class="panel nav" id="navPanel">
    <div class="title"><span class="dot"></span>&nbsp;SELECT TARGET</div>
  </div>
  <div class="panel info" id="infoPanel">
    <div class="title"><b id="infoName">SUN</b></div>
    <div id="infoBody"></div>
  </div>
</div>

<div class="tip" id="tip">
  <b>DRAG</b> ROTATE&nbsp;|&nbsp;<b>SCROLL</b> / <b>PINCH</b> ZOOM&nbsp;|&nbsp;<b>TAP</b> PLANET
</div>
<div class="zoom-hint">PINCH = ZOOM</div>
<div class="mnav">
  <button id="mbtnSpin">SPIN</button>
  <button id="mbtnOrbit">ORBITS</button>
  <button id="mbtnLabel">LABELS</button>
  <button id="mbtnSpeed">TIME</button>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.js"></script>
<script>
/* ============ DATA ============ */
function orbOf(au){return au*9+14}
const PLANS=[
  {id:'mercury',cn:'水星',en:'MERCURY',r:.40,orb:orbOf(.39),tilt:.0167,year:.0587,spin:.6,ax:5.1,
   c:0x8b7e6b,bg:0x8b7e6b,diam:4879},
  {id:'venus',cn:'金星',en:'VENUS',r:.62,orb:orbOf(.72),tilt:177.37,year:.6152,spin:.616,ax:177.37,
   c:0xffd49f,bg:0xffc87a,diam:12104},
  {id:'earth',cn:'地球',en:'EARTH',r:.68,orb:orbOf(1.00),tilt:23.44,year:1,spin:1,ax:90,
   c:0x2a6db0,bg:0x2f9f7f,diam:12742,moon:true},
  {id:'mars',cn:'火星',en:'MARS',r:.34,orb:orbOf(1.52),tilt:-5.24,year:1.881,spin:.972,ax:29.1,
   c:0xc94f2b,bg:0xc94f2b,diam:6779},
  {id:'jupiter',cn:'木星',en:'JUPITER',r:1.85,orb:orbOf(5.20),tilt:-3.13,year:11.86,spin:2.41,ax:0,
   c:0xd9a97a,bg:0xd9a97a,diam:139820},
  {id:'saturn',cn:'土星',en:'SATURN',r:1.62,orb:orbOf(9.58),tilt:-26.73,year:29.45,spin:0.444,ax:95.26,
   c:0xf0d987,bg:0xf0d987,diam:116460,rings:true},
  {id:'uranus',cn:'天王星',en:'URANUS',r:1.32,orb:orbOf(19.20),tilt:-97.77,year:84.02,spin:.444,ax:77.3,
   c:0x9fd8ff,bg:0x9fd8ff,diam:50724},
  {id:'neptune',cn:'海王星',en:'NEPTUNE',r:1.28,orb:orbOf(30.05),tilt:28.32,year:164.8,spin:.669,ax:70.7,
   c:0x4f73e0,bg:0x4f73e0,diam:49244}
];

/* ============ RENDERER ============ */
const canvas=document.createElement('canvas');
document.getElementById('stage').appendChild(canvas);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,premultipliedAlpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setClearColor(0x03040b,1);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
let W=innerWidth,H=innerHeight;
function resize(){W=innerWidth;H=innerHeight;renderer.setSize(W,H);camera.updateProjectionMatrix()}
addEventListener('resize',resize);

/* ============ SCENE ============ */
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x03040b,0.001);

/* ---- 星空 ---- */
{
  const n=9000,pos=new Float32Array(n*3),col=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const u=Math.random(),v=Math.random(),ph=Math.acos(1-2*u);
    const R=280+Math.random()*240;
    pos[i*3]=R*Math.sin(ph)*Math.cos(v*Math.PI*2);
    pos[i*3+1]=R*Math.sin(ph)*Math.sin(v*Math.PI*2);
    pos[i*3+2]=R*Math.cos(ph);
    const b=Math.random();
    if(b<.8){const s=.55+b*.45;col[i*3]=col[i*3+1]=col[i*3+2]=s}
    else if(b<.92){const s=b*.65;col[i*3]=s;col[i*3+1]=s*.8;col[i*3+2]=s*.55}
    else{col[i*3]=.9;col[i*3+1]=.4;col[i*3+2]=.28}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const sm=new THREE.PointsMaterial({vertexColors:true,size:.13,sizeAttenuation:true,transparent:true,opacity:.85});
  scene.add(new THREE.Points(g,sm));
}
/* ---- 银河系 ---- */
{
  const g=document.createElement('canvas');g.width=2048;g.height=512;const c=g.getContext('2d');
  const grad=c.createRadialGradient(1024,256,0,1024,256,1024);
  grad.addColorStop(0,'rgba(180,200,255,.45)');grad.addColorStop(.25,'rgba(120,140,220,.18)');
  grad.addColorStop(.5,'rgba(80,90,180,.06)');grad.addColorStop(1,'rgba(0,0,0,0)');
  c.filter='blur(8px)';c.drawImage(g,0,0);
  const tex=new THREE.CanvasTexture(g);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(440,130),new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:.45,side:THREE.DoubleSide,depthWrite:false}));
  m.rotation.y=Math.PI/2;
  scene.add(m);
}

/* ---- 灯光 ---- */
const sunLight=new THREE.PointLight(0xfff1d6,3.2,0,0.22);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x334466,.55));
const hemi=new THREE.HemisphereLight(0x8899cc,0x221111,.4);scene.add(hemi);
scene.add(new THREE.DirectionalLight(0xfff1d6,.35));
const sunDir=new THREE.DirectionalLight(0xff9900,.5);scene.add(sunDir);

/* ============ SUN ============ */
const sun={id:'sun',cn:'太阳',en:'SUN'};
{
  const mesh=new THREE.Mesh(
    new THREE.SphereGeometry(2.2,48,32),
    new THREE.MeshStandardMaterial({color:0xffc200,emissive:0xffa100,emissiveIntensity:1.8,roughness:.1})
  );
  mesh.position.set(0,0,0);
  scene.add(mesh);
  sun.mesh=mesh;
  const halo=new THREE.Mesh(new THREE.SphereGeometry(2.5,24,16),
    new THREE.MeshBasicMaterial({color:0xff9900,transparent:true,opacity:.18,side:THREE.FrontSide,depthWrite:false}));
  scene.add(halo);
  {
    const n=2500,p=new Float32Array(n*3),a=new Float32Array(n);
    for(let i=0;i<n;i++){
      const t=Math.random()*Math.PI*2,ph=(Math.random()-.5)*Math.PI*1.4,R=2.4+Math.random()*1.8;
      p[i*3]=R*Math.cos(t)*Math.cos(ph);p[i*3+1]=R*Math.cos(t)*Math.sin(ph)*.6;p[i*3+2]=R*Math.sin(t);a[i]=Math.random();
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
    geo.setAttribute('aX',new THREE.Float32BufferAttribute(a,1));
    sun.corona=new THREE.Points(geo,new THREE.PointsMaterial({color:0xffa500,size:.06,sizeAttenuation:true,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false}));
    scene.add(sun.corona);
  }
  sunLight.position.copy(mesh.position);
}

/* ============ PLANETS ============ */
const planets=[];
function makeOrbitLine(orb){
  const n=128,pts=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2;pts.push(new THREE.Vector3(orb*Math.sin(a),0,-orb*Math.cos(a)))}
  return new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x00f0ff,transparent:true,opacity:.16}));
}
function makeLabel(cn,en){
  const cv=document.createElement('canvas');cv.width=220;cv.height=56;
  const c=cv.getContext('2d');
  c.font='bold 26px monospace';c.fillStyle='#ffffffcc';c.shadowColor='#00f0ff';c.shadowBlur=10;c.textAlign='center';c.textBaseline='middle';
  c.fillText(cn,110,22);c.font='14px monospace';c.fillStyle='#8899cc';c.shadowBlur=4;c.fillText(en,110,46);
  const tex=new THREE.CanvasTexture(cv);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,opacity:.75}));
  spr.scale.set(3.2,.68,.01);
  return spr;
}
PLANS.forEach(p=>{
  const mesh=new THREE.Mesh(
    new THREE.SphereGeometry(p.r,64,48),
    new THREE.MeshStandardMaterial({color:new THREE.Color(p.c),emissive:new THREE.Color(p.bg).multiplyScalar(.03),roughness:.55,metalness:.1})
  );
  mesh.castShadow=true;mesh.receiveShadow=true;
  p.mesh=mesh;
  p.orbGroup=new THREE.Group();
  p.orbLine=makeOrbitLine(p.orb);
  p.orbGroup.add(p.orbLine);
  const gl=new THREE.Mesh(new THREE.SphereGeometry(p.r*1.2,24,16),
    new THREE.MeshBasicMaterial({color:new THREE.Color(p.bg).multiplyScalar(.12),transparent:true,opacity:.07,depthWrite:false,blending:THREE.AdditiveBlending}));
  p.orbGroup.add(gl);
  p.meshGroup=new THREE.Group();
  p.meshGroup.add(mesh);
  p.orbGroup.add(p.meshGroup);
  p.sprite=makeLabel(p.cn,p.en);
  p.sprite.position.set(0,p.r*2.2,0);
  p.orbGroup.add(p.sprite);
  p.omega=Math.PI*2/p.year;
  p.phase=Math.random()*Math.PI*2;
  p.ang=0;
  p.orbGroup.rotation.y=p.phase;
  p.orbGroup.rotation.x=Math.PI/2;
  p.meshGroup.rotation.z=-p.tilt*Math.PI/180;
  scene.add(p.orbGroup);
  if(p.id==='earth'){
    const moon=new THREE.Mesh(new THREE.SphereGeometry(.15,24,16),new THREE.MeshStandardMaterial({color:0xb8b8b8,roughness:.9,metalness:.05}));
    p.moons=[{mesh:moon,r:1.7,ang:0,angSpeed:1.3,tilt:.17}];
    p.orbGroup.add(moon);
  }
  if(p.id==='jupiter'){
    p.moons=[
      {mesh:new THREE.Mesh(new THREE.SphereGeometry(.2,24,16),new THREE.MeshStandardMaterial({color:0xc2b28e,roughness:.8})),r:3.2,ang:Math.random()*7,angSpeed:.6,tilt:.1},
      {mesh:new THREE.Mesh(new THREE.SphereGeometry(.15,24,16),new THREE.MeshStandardMaterial({color:0x8f8f8f,roughness:.8})),r:2.6,ang:Math.random()*7,angSpeed:1.0,tilt:.1},
      {mesh:new THREE.Mesh(new THREE.SphereGeometry(.12,24,16),new THREE.MeshStandardMaterial({color:0xffc060,roughness:.8})),r:2.1,ang:Math.random()*7,angSpeed:1.6,tilt:.1}
    ];
    p.moons.forEach(m=>{m.mesh.position.set(m.r*Math.sin(m.ang),0,-m.r*Math.cos(m.ang));p.orbGroup.add(m.mesh)})
  }
  if(p.id==='saturn'){
    p.moons=[
      {mesh:new THREE.Mesh(new THREE.SphereGeometry(.11,24,16),new THREE.MeshStandardMaterial({color:0xffd090,roughness:.7})),r:3.6,ang:Math.random()*7,angSpeed:.8,tilt:.05}
    ];
    p.moons.forEach(m=>{m.mesh.position.set(m.r*Math.sin(m.ang),0,-m.r*Math.cos(m.ang));p.orbGroup.add(m.mesh)})
    const ringGeo=new THREE.TorusGeometry(p.r*2.2,p.r*.4,8,96);
    const ringMat=new THREE.MeshStandardMaterial({color:0xf0d987,transparent:true,opacity:.3,roughness:.8,side:THREE.DoubleSide});
    const ring=new THREE.Mesh(ringGeo,ringMat);
    ring.rotation.x=Math.PI/2;
    p.orbGroup.add(ring);
  }
  planets.push(p);
});

/* ============ INTERACTION ============ */
const camera=new THREE.PerspectiveCamera(62,1,.1,600);
camera.position.set(46,24,50);

let camTheta=Math.atan2(camera.position.x,camera.position.z)+Math.PI;
let camPhi=Math.acos(camera.position.y/Math.hypot(camera.position.x,camera.position.y,camera.position.z));
let camR=Math.hypot(camera.position.x,camera.position.y,camera.position.z);
let targetTheta=camTheta,targetPhi=camPhi,targetR=camR;

let dragging=false,mx=0,my=0;
const pickable=[...planets.map(p=>p.mesh),sun.mesh];
function pickOnEvent(e){
  const r=document.getElementById('stage').getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*2-1;
  const y=(e.clientY-r.top)/r.height*2-1;
  const ray=new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector3(x,y),camera);
  const hits=ray.intersectObjects(pickable);
  if(hits.length)return hits[0].object;
  return null;
}
function focusPlanet(p){
  const w=new THREE.Vector3();p.meshGroup.getWorldPosition(w);
  targetTheta=Math.atan2(w.x,w.z)+Math.PI/2;
  targetPhi=Math.PI/2.5;
  targetR=Math.max(12,10+p.r*8);
  /* 选中 */
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  if(p.navItem)p.navItem.classList.add('active');
  /* 信息 */
  const info=document.getElementById('infoPanel');
  document.getElementById('infoName').textContent=p.cn+' · '+p.en;
  document.getElementById('infoBody').innerHTML=`
    <div class="row"><span>ORBITAL PERIOD</span><b>${p.year.toFixed(2)} YRS</b></div>
    <div class="row"><span>DIAMETER</span><b>${p.diam} KM</b></div>
    <div class="row"><span>AXIAL TILT</span><b>${p.tilt.toFixed(1)}°</b></div>`;
  info.classList.add('show');
}
function focusSun(){
  targetTheta=Math.PI/2;targetPhi=Math.PI/2.5;targetR=24;
  document.getElementById('infoPanel').classList.remove('show');
}
const navPanel=document.getElementById('navPanel');
PLANS.forEach(p=>{
  const d=document.createElement('div');
  d.className='nav-item';
  const sw=document.createElement('div');sw.className='swatch';sw.style.color='#'+p.bg.toString(16).padStart(6,'0');
  const txt=document.createElement('span');txt.textContent=p.cn;
  const dt=document.createElement('span');dt.className='d';dt.textContent=Math.round(p.year)+'Y';
  d.append(sw,txt,dt);
  d.addEventListener('click',()=>focusPlanet(p));
  navPanel.appendChild(d);
  p.navItem=d;
});
const btn={
  spin:document.getElementById('btnSpin'),
  reset:document.getElementById('btnReset'),
  orbits:document.getElementById('btnOrbit'),
  labels:document.getElementById('btnLabels'),
  speed:document.getElementById('btnSpeed')
};
const mBtn={
  spin:document.getElementById('mbtnSpin'),
  orbit:document.getElementById('mbtnOrbit'),
  label:document.getElementById('mbtnLabel'),
  speed:document.getElementById('mbtnSpeed')
};
let spinOn=true,orbitsOn=true,labelsOn=true,timeScale=1;
function setSpin(v){spinOn=v;btn.spin.classList.toggle('on',v);mBtn.spin.classList.toggle('on',v)}
function setOrbits(v){orbitsOn=v;btn.orbits.classList.toggle('on',v);mBtn.orbit.classList.toggle('on',v);planets.forEach(p=>p.orbLine.material.opacity=v?0.16:0)}
function setLabels(v){labelsOn=v;btn.labels.classList.toggle('on',v);mBtn.label.classList.toggle('on',v);planets.forEach(p=>p.sprite.material.opacity=v?0.75:0)}
setSpin(true);setOrbits(true);setLabels(true);
btn.reset.addEventListener('click',()=>{targetTheta=camTheta;targetPhi=camPhi;targetR=camR});
btn.orbits.addEventListener('click',()=>setOrbits(!orbitsOn));
mBtn.orbit.addEventListener('click',()=>setOrbits(!orbitsOn));
btn.labels.addEventListener('click',()=>setLabels(!labelsOn));
mBtn.label.addEventListener('click',()=>setLabels(!labelsOn));
btn.speed.addEventListener('click',()=>{
  const t=document.querySelectorAll('#speedTrack button');
  let idx=0;t.forEach((b,i)=>{if(b.classList.contains('on'))idx=i})
  idx=(idx+1)%t.length;
  t.forEach((b,i)=>b.classList.toggle('on',i===idx));
  const v=+t[idx].dataset.v;timeScale=v;
  btn.speed.textContent='TIME '+v+'x';mBtn.speed.textContent='TIME '+v+'x';
});
mBtn.speed.addEventListener('click',()=>btn.speed.click());

/* ============ CAMERA CONTROL ============ */
function updateCam(dt){
  const dx=Math.sin(targetPhi)*Math.cos(targetTheta)*targetR;
  const dy=Math.cos(targetPhi)*targetR;
  const dz=Math.sin(targetPhi)*Math.sin(targetTheta)*targetR;
  camera.position.lerp({x:dx,y:dy,z:dz},0.06);
  camera.lookAt(new THREE.Vector3(0,0,0));
}
canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse'&&e.pointerType!=='pen')return;
  if(e.button!==0)return;
  dragging=true;mx=e.clientX;my=e.clientY;
  canvas.style.cursor='grabbing';
});
canvas.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-mx,dy=e.clientY-my;
  if(Math.abs(dx)+Math.abs(dy)>2){
    targetPhi=Math.min(Math.PI-0.05,Math.max(0.05,targetPhi-dy*0.0035));
    targetTheta-=dx*0.0035;
    mx=e.clientX;my=e.clientY;
  }
});
canvas.addEventListener('pointerup',e=>{
  if(!dragging)return;
  dragging=false;canvas.style.cursor='none';
  const dx=Math.abs(e.clientX-mx),dy=Math.abs(e.clientY-my);
  if(dx<8&&dy<8){
    const hit=pickOnEvent(e);
    if(hit){
      if(hit===sun.mesh)focusSun();
      else{const p=planets.find(x=>x.mesh===hit);if(p)focusPlanet(p)}
    }
  }
});
let ts={active:false,sx:0,sy:0,press:false,d0:0};
addEventListener('touchstart',e=>{
  if(e.touches.length>1){ts.active=true;ts.d0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}
  else{ts.active=true;ts.sx=e.touches[0].clientX;ts.sy=e.touches[0].clientY;ts.press=true}
},{passive:false});
addEventListener('touchmove',e=>{
  if(e.touches.length>1){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(ts.d0){targetR*=d/ts.d0}
  }else{
    if(ts.press){
      const dx=e.touches[0].clientX-ts.sx,dy=e.touches[0].clientY-ts.sy;
      if(Math.abs(dx)+Math.abs(dy)>2){
        targetPhi=Math.min(Math.PI-0.05,Math.max(0.05,targetPhi-dy*0.0035));
        targetTheta-=dx*0.0035;
        ts.sx=e.touches[0].clientX;ts.sy=e.touches[0].clientY;
      }
    }
  }
},{passive:false});
addEventListener('touchend',e=>{
  ts.active=false;ts.press=false;ts.d0=0;
  const dx=Math.abs(e.changedTouches[0].clientX-ts.sx),dy=Math.abs(e.changedTouches[0].clientY-ts.sy);
  if(dx<8&&dy<8){
    const hit=pickOnEvent(e);
    if(hit){
      if(hit===sun.mesh)focusSun();
      else{const p=planets.find(x=>x.mesh===hit);if(p)focusPlanet(p)}
    }
  }
},{passive:false});
addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.deltaY>0)targetR*=1.08;else targetR*=0.92;
},{passive:false});

/* ============ ANIMATION ============ */
let simDay=0,prevT=0;
function updateOrbits(dt){
  planets.forEach(p=>{
    p.ang=(p.ang||0)+dt*p.omega*timeScale;
    p.orbGroup.rotation.y=p.ang+p.phase;
    p.orbGroup.rotation.x=Math.PI/2;
    p.meshGroup.rotation.y+=dt*p.omega*timeScale/30+0.02;
  });
  planets.forEach(p=>{
    (p.moons||[]).forEach(m=>{
      m.ang=(m.ang||0)+dt*m.angSpeed*timeScale*.15;
      m.mesh.position.set(m.r*Math.sin(m.ang),0,-m.r*Math.cos(m.ang));
    });
  });
  sun.corona.rotation.y+=dt*.05;
  sun.corona.rotation.z+=dt*.03;
  simDay+=dt*timeScale;
  document.getElementById('simDay').textContent='DAY '+Math.floor(simDay).toString().padStart(3,'0');
  const secs=simDay*86400*0.1;
  const h=Math.floor(secs/3600)%24|0;
  const m=Math.floor(secs/60)%60|0;
  document.getElementById('simDate').textContent='SIM TIME · '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':00';
}
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(t-prevT)/1000);prevT=t;
  updateOrbits(dt);
  updateCam(dt);
  renderer.render(scene,camera);
}
prevT=performance.now();
requestAnimationFrame(loop);
</script>
</body>
</html>
